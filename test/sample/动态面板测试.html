<script>
// model.js —— 文档模型
// 结构对齐 CODEPLAN.md §3 JSON Schema；形状、页面、交互、动态面板状态等字段都在此定义与归一化
"use strict";

window.VX = window.VX || {};

(function () {
  let nextShapeId = 1;
  let nextPageId = 1;

  const listeners = {}; // event -> [fn]
  function on(evt, fn) { (listeners[evt] = listeners[evt] || []).push(fn); }
  function emit(evt, data) { (listeners[evt] || []).forEach((fn) => { try { fn(data); } catch (e) { console.error(e); } }); }

  const state = {
    selection: [],      // 选中的 shape id 列表
    selGuides: [],      // 选中的参考线（当前页内索引）
    tool: "select",
    zoom: 1,
    ox: 40, oy: 40,     // 世界原点的屏幕偏移（平移）
    grid: true,
    gridSize: 10,
    gridKind: "small",  // 网格绘制样式：small / large / dots / none（跟着页面设置走）
    mouse: { x: 0, y: 0 },   // 画布内屏幕坐标
    marquee: null,      // 框选矩形（世界坐标）
    alignLines: [],     // 吸附对齐线（世界坐标，瞬态）
    spaceDown: false,
    dirty: true,
    currentLayer: "l1", // 当前层：新形状归入
    enterGroup: null,   // 双击进入组合编辑时的组 id
    panelEdit: null,    // {panelId, stateId} 进入动态面板状态编辑
    rubberConn: null,   // 连接线拖拽预览 {begin:{x,y}, cur:{x,y}}（世界坐标，瞬态）
    hoverShapeId: null, // 鼠标悬停的形状 id（用于显示连接点，瞬态）
    hoverAnchor: null,  // 连接点吸附高亮 {id, index}（瞬态）
    hoverConnEnd: null, // 连接线端点悬停 {id, which:'begin'|'end'}（瞬态）
    connEndDrag: false, // 正在拖拽连接线端点（用于显示全部连接点）
  };

  const doc = {
    format: "visioxure",
    version: 1,
    doc: { theme: "light", variables: [] },
    assets: [],    // 图片资产：{ id, name, mime, ext, w, h, hash, dataUrl }
    library: [],   // 组件库母版：{ id, name, w, h, shapes: [] }
    pages: [],
  };

  let currentPageId = null;

  // 页面纸张的默认背景色：新建页面、新建文档、旧文件与未声明底色的 VSDX 都回退到它
  const DEFAULT_PAGE_BG = "#FFFFFF";

  // 页面网格样式：小网格（10px 细线）/ 大网格（10px 细线 + 每 50px 主线）/ 网点 / 无。
  // 只影响编辑器里的绘制与吸附，不进任何导出产物
  const GRID_KINDS = ["small", "large", "dots", "none"];

  // 当前页的网格样式落到编辑器状态：state.grid 仍是「显示 + 吸附」总开关（tools.js 靠它判断）
  function applyPageGrid(p) {
    const kind = p && GRID_KINDS.indexOf(p.grid) >= 0 ? p.grid : "small";
    state.gridKind = kind;
    state.grid = kind !== "none";
  }

  function makePage(name) {
    return {
      id: "p" + nextPageId++,
      name: name || ("页面-" + nextPageId),
      size: { mode: "fixed", w: 800, h: 1100, orientation: "portrait" },
      background: DEFAULT_PAGE_BG,  // 页面背景色
      grid: "small",        // 网格样式（页面设置里改）
      guides: [],           // {dir:'v'|'h', pos} 世界坐标
      variables: [],
      layers: [{ id: "l1", name: "默认", visible: true, locked: false }],
      shapes: [],
    };
  }

  function defaultStyle(type) {
    if (type === "text") {
      return { fill: "transparent", line: "transparent", lineWidth: 0, cornerRadius: 0, opacity: 1,
               font: { family: "Segoe UI", size: 14, color: "#333333", bold: false, align: "left", vAlign: "top" } };
    }
    if (type === "path") {
      return { fill: "#7B68EE", line: "#5646B0", lineWidth: 1.5, cornerRadius: 0, opacity: 1,
               font: { family: "Segoe UI", size: 14, color: "#FFFFFF", bold: false, align: "center", vAlign: "middle" } };
    }
    if (type === "connector") {
      return { line: "#37474F", lineWidth: 1.5, arrowEnd: true, arrowBegin: false,
               arrowEndKind: "arrow", arrowBeginKind: "none",
               arrowEndType: 4, arrowBeginType: 0, arrowEndSize: 2, arrowBeginSize: 2, opacity: 1,
               font: { family: "Segoe UI", size: 12, color: "#333333", bold: false, align: "center", vAlign: "middle" } };
    }
    if (type === "panel") {
      // 动态面板是透明容器，边框只在编辑器里以虚线示意
      return { fill: "transparent", line: "transparent", lineWidth: 1, cornerRadius: 0, opacity: 1,
               font: { family: "Segoe UI", size: 14, color: "#333333", bold: false, align: "center", vAlign: "middle" } };
    }
    if (type === "repeater") {
      // 中继器是透明容器：内容由数据集 + 模板重复渲染，边框只在编辑器里示意
      return { fill: "transparent", line: "transparent", lineWidth: 1, cornerRadius: 0, opacity: 1,
               font: { family: "Segoe UI", size: 14, color: "#333333", bold: false, align: "left", vAlign: "top" } };
    }
    if (type === "instance") {
      return null;   // 组件实例的样式由快照子形状各自持有
    }
    if (type === "image") {
      // 图片默认无填充/无边框，内容由 assetId 决定；边框仍可在样式面板打开
      return { fill: "transparent", line: "transparent", lineWidth: 1, cornerRadius: 0, opacity: 1,
               font: { family: "Segoe UI", size: 14, color: "#333333", bold: false, align: "center", vAlign: "middle" } };
    }
    if (type === "ellipse") {
      return { fill: "#5BA85B", line: "#3D7A3D", lineWidth: 1.5, cornerRadius: 0, opacity: 1,
               font: { family: "Segoe UI", size: 14, color: "#FFFFFF", bold: false, align: "center", vAlign: "middle" } };
    }
    return { fill: "#4A90D9", line: "#2B6CB0", lineWidth: 1.5, cornerRadius: 4, opacity: 1,
             font: { family: "Segoe UI", size: 14, color: "#FFFFFF", bold: false, align: "center", vAlign: "middle" } };
  }

  // path 的 subpaths 是「设计尺寸」下的局部坐标；创建/载入时把当时的包围盒固化为 design，
  // 之后改 w/h 就是相对 design 缩放图形（见 Geometry.pathScale）。
  // 必须在数据进入模型时物化：留到绘制时才取默认值的话，默认值会跟着新 w/h 一起变，缩放永远是 1
  function ensurePathDesign(s) {
    if (s && s.type === "path" && s.path && !s.path.design) s.path.design = { w: s.w, h: s.h };
  }

  // ---- 动态面板：数据契约与树操作 ----
  // shape.name = 面板名（状态编辑页签标题）；panel = { states, active, clip }
  // 状态里的子形状用世界坐标，面板本身是「视口」：移动时整体平移，改尺寸只改视口。
  function defaultPanel() {
    return { states: [{ id: "st1", name: "状态 1", shapes: [] }], active: "st1", clip: true };
  }

  // 新建面板的显示名：按文档里已用过的名字递增，避免「动态面板 1」重名
  function nextPanelName() {
    const used = new Set();
    const walk = (arr) => {
      for (const s of arr || []) {
        if (s.type === "panel" && s.name) used.add(s.name);
        walk(s.children);
        for (const st of (s.panel && s.panel.states) || []) walk(st.shapes);
        for (const t of (s.repeater && s.repeater.template) || []) walk(t);
      }
    };
    for (const p of doc.pages || []) walk(p.shapes);
    let n = 1;
    while (used.has("动态面板 " + n)) n++;
    return "动态面板 " + n;
  }

  // 所有入口（新建 / 载入 / VSDX 读回）都过这一层：旧文件可能缺 states、active、
  // 状态 id、shapes，甚至还是 P4 之前的 {action,targets} 旧 schema。
  // defaultClip=false 用于「载入旧文档」：旧文件本来不裁剪，强行开启会让坐标漂移到
  // 视口外的内容（历史版本移动面板不带动子形状留下的）突然全部消失。
  function normalizePanel(s, defaultClip) {
    if (!s || s.type !== "panel") return;
    // 先记下原文件是否显式声明过 clip：整段重建（旧 schema）时 defaultPanel 的 true 不能盖过它
    const raw = s.panel;
    const declaredClip = raw && typeof raw === "object" && !Array.isArray(raw) && typeof raw.clip === "boolean"
      ? raw.clip : null;
    if (!raw || typeof raw !== "object" || Array.isArray(raw) || !Array.isArray(raw.states)) {
      s.panel = defaultPanel();
    }
    const p = s.panel;
    p.states = p.states.filter((st) => st && typeof st === "object");
    if (!p.states.length) p.states = [{ id: "st1", name: "状态 1", shapes: [] }];
    const used = new Set();
    p.states.forEach((st, i) => {
      if (!st.id || used.has(st.id)) {
        let id = "st" + (i + 1) + "_" + i;
        let n = 1;
        while (used.has(id)) id = "st" + (i + 1) + "_" + (n++);
        st.id = id;
      }
      used.add(st.id);
      if (!st.name) st.name = "状态 " + (i + 1);
      if (!Array.isArray(st.shapes)) st.shapes = [];
    });
    if (!p.states.some((st) => st.id === p.active)) p.active = p.states[0].id;
    p.clip = declaredClip === null ? (defaultClip !== false) : declaredClip;
    if (!s.name) s.name = nextPanelName();
  }

  // 平移整棵子树：容器子形状（含连接线端点/折点、嵌套面板、中继器模板）都要跟着走
  function translateShapeTree(s, dx, dy) {
    if (!s) return;
    s.x = (s.x || 0) + dx;
    s.y = (s.y || 0) + dy;
    if (s.type === "connector") {
      for (const k of ["begin", "end"]) if (s[k]) { s[k].x += dx; s[k].y += dy; }
      for (const p of s.points || []) { p.x += dx; p.y += dy; }
    }
    for (const ch of s.children || []) translateShapeTree(ch, dx, dy);
    for (const st of (s.panel && s.panel.states) || []) for (const ch of st.shapes || []) translateShapeTree(ch, dx, dy);
    for (const t of (s.repeater && s.repeater.template) || []) translateShapeTree(t, dx, dy);
  }

  const Model = {
    doc,
    state,
    on,
    emit,
    defaultStyleFor: defaultStyle, // 供形状库合并模板差异样式
    DEFAULT_PAGE_BG,               // 页面纸张默认背景色（新建文档/新页面共用同一个值）

    init() {
      const p = makePage("页面-1");
      doc.pages.push(p);
      currentPageId = p.id;
      applyPageGrid(p);
      state.dirty = true;
    },

    // ---- 页面 ----
    page(id) { return doc.pages.find((p) => p.id === (id || currentPageId)); },
    currentPageId() { return currentPageId; },
    setCurrentPage(id) {
      if (doc.pages.some((p) => p.id === id)) {
        currentPageId = id;
        applyPageGrid(this.page(id));   // 网格样式是每页的设置
        state.selection = [];
        state.selGuides = [];
        state.panelEdit = null;  // 状态编辑上下文属于某一页，换页后必须失效
        state.enterGroup = null;
        state.dirty = true;
        emit("pagechange");
      }
    },
    addPage() {
      const p = makePage("页面-" + (doc.pages.length + 1));
      doc.pages.push(p);
      currentPageId = p.id;
      applyPageGrid(p);
      state.selection = [];
      state.selGuides = [];
      state.dirty = true;
      emit("pagechange");
      emit("change");
      return p;
    },
    renamePage(id, name) {
      const p = this.page(id);
      if (p && name) { p.name = name; state.dirty = true; emit("pagechange"); emit("change"); }
    },
    deletePage(id) {
      if (doc.pages.length <= 1) return false;
      const i = doc.pages.findIndex((p) => p.id === id);
      if (i < 0) return false;
      doc.pages.splice(i, 1);
      if (currentPageId === id) {
        currentPageId = doc.pages[Math.min(i, doc.pages.length - 1)].id;
        applyPageGrid(this.page(currentPageId));
        state.selection = [];
        state.selGuides = [];
      }
      state.dirty = true;
      emit("pagechange");
      emit("change");
      return true;
    },
    // 把页面直接挪到指定下标（拖拽排序用）；下标先夹到合法范围，原地不动则返回 false
    movePageTo(id, index) {
      const i = doc.pages.findIndex((p) => p.id === id);
      if (i < 0) return false;
      const j = Math.max(0, Math.min(doc.pages.length - 1, Math.floor(index)));
      if (j === i) return false;
      const [p] = doc.pages.splice(i, 1);
      doc.pages.splice(j, 0, p);
      state.dirty = true;
      emit("pagechange");
      emit("change");
      return true;
    },
    movePage(id, delta) {
      const i = doc.pages.findIndex((p) => p.id === id);
      if (i < 0) return false;
      return this.movePageTo(id, i + delta);
    },
    // 页面网格样式：small / large / dots / none（非法值回退小网格）
    setPageGrid(kind) {
      const p = this.page();
      if (!p) return;
      p.grid = GRID_KINDS.indexOf(kind) >= 0 ? kind : "small";
      applyPageGrid(p);
      state.dirty = true;
      emit("pagechange");
      emit("change");
    },
    // 页面尺寸（px）：宽/高写入 size，横竖方向随之推导
    setPageSize(w, h) {
      const p = this.page();
      if (!p) return;
      if (!p.size) p.size = { mode: "fixed", w: 800, h: 1100 };
      if (typeof w === "number" && isFinite(w) && w > 0) p.size.w = w;
      if (typeof h === "number" && isFinite(h) && h > 0) p.size.h = h;
      p.size.orientation = p.size.w > p.size.h ? "landscape" : "portrait";
      state.dirty = true;
      emit("pagechange");
      emit("change");
    },
    // 页面背景色：留空回落到白色
    setPageBackground(color) {
      const p = this.page();
      if (!p) return;
      p.background = color || "#FFFFFF";
      state.dirty = true;
      emit("pagechange");
      emit("change");
    },

    // ---- 形状 ----
    shapes() { return this.page().shapes; },
    shape(id) {
      const find = (arr) => {
        for (const s of arr || []) {
          if (s.id === id) return s;
          if (s.type === "group" || s.type === "instance") { const f = find(s.children); if (f) return f; }
          if (s.type === "panel") {
            for (const st of (s.panel && s.panel.states) || []) {
              const f = find(st.shapes);
              if (f) return f;
            }
          }
        }
        return null;
      };
      return find(this.page().shapes);
    },
    maxZ() {
      const mx = (arr) => (arr || []).reduce((m, s) => Math.max(m, s.z || 0), 0);
      let m = mx(this.page().shapes);
      const pe = state.panelEdit;
      if (pe) {
        const p = this.shape(pe.panelId);
        const st = p && this.panelStateById(p, pe.stateId);
        if (st) m = mx(st.shapes);
      }
      return m;
    },

    // ---- 动态面板 ----
    normalizePanel,
    panelStates(s) { return (s && s.type === "panel" && s.panel && Array.isArray(s.panel.states)) ? s.panel.states : []; },
    panelStateById(panel, id) { return this.panelStates(panel).find((x) => x.id === id) || null; },
    panelState(panel) {
      const st = this.panelStates(panel);
      if (!st.length) return null;
      const hit = st.find((x) => x.id === (panel.panel && panel.panel.active));
      return hit || st[0];
    },
    activePanelShapes(panel) {
      const st = this.panelState(panel);
      if (!st) return [];
      if (!Array.isArray(st.shapes)) st.shapes = [];
      return st.shapes;
    },
    // 缺省裁剪（视口语义）；显式 clip:false 才让内容溢出显示
    panelClip(s) { return !!(s && s.type === "panel" && (!s.panel || s.panel.clip !== false)); },
    // 状态编辑页签标题：面板名（旧文件没有 name 时用 id 兜底）
    panelName(s) { return (s && (s.name || (s.type === "panel" ? "动态面板 " + s.id : s.id))) || "动态面板"; },
    addPanelState(panel, name, copyFromId) {
      normalizePanel(panel);
      const p = panel.panel;
      const src = copyFromId ? this.panelStateById(panel, copyFromId) : null;
      let shapes = [];
      if (src) {
        shapes = JSON.parse(JSON.stringify(src.shapes || []));
        const reid = (x) => {
          x.id = this.nextId();
          for (const c of x.children || []) reid(c);
          for (const st of (x.panel && x.panel.states) || []) for (const c of st.shapes || []) reid(c);
          for (const t of (x.repeater && x.repeater.template) || []) reid(t);
        };
        shapes.forEach(reid);
      }
      const st = { id: "st" + Date.now().toString(36) + "_" + (p.states.length + 1),
                   name: name || ("状态 " + (p.states.length + 1)), shapes };
      p.states.push(st);
      p.active = st.id;
      state.dirty = true;
      emit("change");
      return st;
    },
    removePanelState(panel, id) {
      normalizePanel(panel);
      const p = panel.panel;
      if (p.states.length <= 1) return false;   // 至少保留一个状态
      const i = p.states.findIndex((x) => x.id === id);
      if (i < 0) return false;
      p.states.splice(i, 1);
      if (p.active === id) p.active = p.states[Math.min(i, p.states.length - 1)].id;
      const pe = state.panelEdit;
      if (pe && pe.panelId === panel.id && pe.stateId === id) {
        pe.stateId = p.active;
        state.selection = [];
      }
      state.dirty = true;
      emit("change");
      return true;
    },
    // 状态排序（拖拽/上移下移）：只改顺序，不影响 active 与内容
    movePanelState(panel, id, delta) {
      normalizePanel(panel);
      const arr = panel.panel.states;
      const i = arr.findIndex((x) => x.id === id);
      if (i < 0) return false;
      const j = Math.max(0, Math.min(arr.length - 1, i + delta));
      if (i === j) return false;
      const [st] = arr.splice(i, 1);
      arr.splice(j, 0, st);
      state.dirty = true;
      emit("change");
      return true;
    },
    setPanelState(panel, id) {
      if (this.panelStateById(panel, id)) {
        panel.panel.active = id;
        const pe = state.panelEdit;
        if (pe && pe.panelId === panel.id) pe.stateId = id;
        state.dirty = true;
        emit("change");
      }
    },
    // 全部状态内容的包围盒并集（用于「适应内容尺寸」；容器子形状按自身包围盒计）
    panelContentBounds(panel) {
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      const add = (s) => {
        if (s.type === "connector") {
          for (const p of [s.begin, s.end]) {
            if (!p) continue;
            minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
            minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
          }
          return;
        }
        minX = Math.min(minX, s.x || 0); minY = Math.min(minY, s.y || 0);
        maxX = Math.max(maxX, (s.x || 0) + (s.w || 0)); maxY = Math.max(maxY, (s.y || 0) + (s.h || 0));
      };
      for (const st of this.panelStates(panel)) for (const ch of st.shapes || []) add(ch);
      return minX === Infinity ? null : { x: minX, y: minY, w: Math.max(1, maxX - minX), h: Math.max(1, maxY - minY) };
    },
    // 视口对齐内容：内容保持世界坐标不动，只改面板的 x/y/w/h
    fitPanelToContent(panel) {
      const b = this.panelContentBounds(panel);
      if (!b) return false;
      panel.x = b.x; panel.y = b.y; panel.w = b.w; panel.h = b.h;
      state.dirty = true;
      emit("change");
      return true;
    },

    addShape(type, props) {
      const s = Object.assign({
        id: this.nextId(),
        type,
        x: 0, y: 0, w: 120, h: 80, angle: 0,
        z: this.maxZ() + 1,
        layer: state.currentLayer,
        lock: false,
        text: type === "text" ? "文本" : "",
        style: defaultStyle(type),
      }, props || {});
      ensurePathDesign(s);
      if (type === "panel") {
        if (!props || !props.panel) s.panel = defaultPanel();
        normalizePanel(s);   // 形状库/外部 JSON 的 panel 也统一补齐 active/clip
      }
      // 面板状态编辑中：新形状归入该状态，其余归页面
      const pe = state.panelEdit;
      if (pe) {
        const panel = this.shape(pe.panelId);
        const st = panel && this.panelStateById(panel, pe.stateId);
        if (st) {
          if (!Array.isArray(st.shapes)) st.shapes = [];
          st.shapes.push(s);
          state.dirty = true;
          return s;
        }
      }
      this.page().shapes.push(s);
      state.dirty = true;
      return s;
    },

    // 形状 id 分配（形状库创建组合子形状时复用）
    nextId() { return "s" + nextShapeId++; },

    updateShape(id, props) {
      const s = this.shape(id);
      if (s) { Object.assign(s, props); state.dirty = true; }
      return s;
    },

    // 深拷贝形状（组递归重生成 id，避免复制后 id 冲突），偏移 (+10,+10)
    duplicateShape(id) {
      const src = this.shape(id);
      if (!src) return null;
      const copy = JSON.parse(JSON.stringify(src));
      const reid = (x) => {
        x.id = "s" + nextShapeId++;
        if ((x.type === "group" || x.type === "instance") && x.children) x.children.forEach(reid);
        if (x.type === "panel") for (const st of (x.panel && x.panel.states) || []) (st.shapes || []).forEach(reid);
        if (x.type === "repeater") for (const t of (x.repeater && x.repeater.template) || []) reid(t);
        return x;
      };
      reid(copy);
      // 容器子形状是世界坐标：副本整体偏移 (+10,+10) 时它们必须一起走
      const shiftKids = (s) => {
        for (const c of s.children || []) translateShapeTree(c, 10, 10);
        for (const st of (s.panel && s.panel.states) || []) for (const c of st.shapes || []) translateShapeTree(c, 10, 10);
      };
      shiftKids(copy);
      if (copy.type === "panel") copy.name = nextPanelName();
      copy.x += 10; copy.y += 10;
      copy.z = this.maxZ() + 1;
      this.page().shapes.push(copy);
      state.dirty = true;
      return copy;
    },

    removeShapes(ids) {
      const set = new Set(ids);
      // 面板状态编辑中：只删除该状态内的形状
      const pe = state.panelEdit;
      if (pe) {
        const panel = this.shape(pe.panelId);
        const st = panel && this.panelStateById(panel, pe.stateId);
        if (st) {
          st.shapes = (st.shapes || []).filter((s) => !set.has(s.id));
          state.selection = state.selection.filter((id) => !set.has(id));
          state.dirty = true;
          return;
        }
      }
      const pg = this.page();
      // 递归过滤：支持组编辑模式下删除子形状；删除后同步组包围盒
      const filt = (arr) => {
        const out = [];
        for (const s of arr) {
          if ((s.type === "group" || s.type === "instance") && s.children) s.children = filt(s.children);
          if (!set.has(s.id)) out.push(s);
        }
        return out;
      };
      pg.shapes = filt(pg.shapes);
      for (const s of pg.shapes) if (s.type === "group" || s.type === "instance") this.syncGroupBounds(s);
      state.selection = state.selection.filter((id) => !set.has(id));
      state.dirty = true;
    },

    // ---- P2：组合 / 解组 / 布尔 / 对齐 ----
    // 平移形状：组合/实例/动态面板的子形状都是世界坐标，必须整体跟随
    moveShapeBy(s, dx, dy) {
      if (!s) return;
      s.x += dx; s.y += dy;
      if (s.type === "group" || s.type === "instance") {
        for (const ch of s.children || []) translateShapeTree(ch, dx, dy);
      } else if (s.type === "panel") {
        for (const st of this.panelStates(s)) for (const ch of st.shapes || []) translateShapeTree(ch, dx, dy);
      }
    },

    // 组包围盒 = 子形状 AABB 并集（旋转形状按其 AABB，P2 简化）
    syncGroupBounds(g) {
      if (!g || g.type !== "group") return;
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const ch of g.children || []) {
        if (ch.type === "group") this.syncGroupBounds(ch);
        minX = Math.min(minX, ch.x); minY = Math.min(minY, ch.y);
        maxX = Math.max(maxX, ch.x + ch.w); maxY = Math.max(maxY, ch.y + ch.h);
      }
      if (minX === Infinity) return;
      g.x = minX; g.y = minY; g.w = maxX - minX; g.h = maxY - minY;
    },

    group(ids) {
      const shapes = (ids || state.selection).map((id) => this.shape(id)).filter(Boolean);
      if (shapes.length < 2) return null;
      const pg = this.page();
      const z = Math.max(...shapes.map((s) => s.z || 0));
      const set = new Set(shapes.map((s) => s.id));
      const g = {
        id: "s" + nextShapeId++,
        type: "group",
        x: 0, y: 0, w: 0, h: 0, angle: 0,
        z: z,
        layer: state.currentLayer,
        lock: false, text: "", style: null,
        children: shapes,
      };
      this.syncGroupBounds(g);
      pg.shapes = pg.shapes.filter((s) => !set.has(s.id));
      pg.shapes.push(g);
      state.selection = [g.id];
      state.enterGroup = null;
      state.dirty = true;
      emit("change");
      return g;
    },

    ungroup(ids) {
      const pg = this.page();
      const out = [];
      for (const id of (ids || state.selection)) {
        const g = this.shape(id);
        if (!g || g.type !== "group") continue;
        // 子形状回到页面（z 保持），插入到组原来所在位置之前
        const at = pg.shapes.indexOf(g);
        for (const ch of (g.children || []).reverse()) {
          pg.shapes.splice(at, 0, ch);
        }
        pg.shapes = pg.shapes.filter((s) => s !== g);
        out.push(...(g.children || []).map((c) => c.id));
      }
      state.selection = out;
      state.enterGroup = null;
      state.dirty = true;
      emit("change");
      return out;
    },

    // 布尔运算：kind = 'union' | 'intersect' | 'subtract'
    booleanOp(kind) {
      const shapes = state.selection.map((id) => this.shape(id))
        .filter(Boolean)
        .filter((s) => ["rect", "ellipse", "path", "text"].includes(s.type))
        .sort((a, b) => (a.z || 0) - (b.z || 0)); // z 升序：底层为 subject
      if (shapes.length < 2) return null;
      const props = VX.Geometry.booleanShape(kind, shapes);
      if (!props) return null;
      const pg = this.page();
      const at = pg.shapes.indexOf(shapes[0]); // 结果占据最底层形状的位置
      const ids = new Set(shapes.map((s) => s.id));
      const s = this.addShape("path", props);
      pg.shapes = pg.shapes.filter((x) => !ids.has(x.id));
      pg.shapes.splice(Math.max(0, at), 0, s);
      state.selection = [s.id];
      state.dirty = true;
      emit("change");
      return s;
    },

    // 多选对齐：kind = left|hcenter|right|top|vcenter|bottom
    align(kind) {
      const shapes = state.selection.map((id) => this.shape(id)).filter(Boolean);
      if (shapes.length < 2) return;
      const minX = Math.min(...shapes.map((s) => s.x));
      const maxX = Math.max(...shapes.map((s) => s.x + s.w));
      const minY = Math.min(...shapes.map((s) => s.y));
      const maxY = Math.max(...shapes.map((s) => s.y + s.h));
      for (const s of shapes) {
        if (kind === "left") this.moveShapeBy(s, minX - s.x, 0);
        else if (kind === "right") this.moveShapeBy(s, maxX - (s.x + s.w), 0);
        else if (kind === "hcenter") this.moveShapeBy(s, (minX + maxX) / 2 - (s.x + s.w / 2), 0);
        else if (kind === "top") this.moveShapeBy(s, 0, minY - s.y);
        else if (kind === "bottom") this.moveShapeBy(s, 0, maxY - (s.y + s.h));
        else if (kind === "vcenter") this.moveShapeBy(s, 0, (minY + maxY) / 2 - (s.y + s.h / 2));
      }
      state.dirty = true;
      emit("change");
    },

    // 均分：axis = 'h' | 'v'（按包围盒，至少 3 个）
    distribute(axis) {
      const shapes = state.selection.map((id) => this.shape(id)).filter(Boolean);
      if (shapes.length < 3) return;
      if (axis === "h") {
        shapes.sort((a, b) => a.x - b.x);
        const total = (shapes[shapes.length - 1].x) - shapes[0].x;
        const sumW = shapes.reduce((m, s) => m + s.w, 0);
        const gap = (total - sumW) / (shapes.length - 1);
        let cur = shapes[0].x;
        for (const s of shapes) { this.moveShapeBy(s, cur - s.x, 0); cur += s.w + gap; }
      } else {
        shapes.sort((a, b) => a.y - b.y);
        const total = (shapes[shapes.length - 1].y) - shapes[0].y;
        const sumH = shapes.reduce((m, s) => m + s.h, 0);
        const gap = (total - sumH) / (shapes.length - 1);
        let cur = shapes[0].y;
        for (const s of shapes) { this.moveShapeBy(s, 0, cur - s.y); cur += s.h + gap; }
      }
      state.dirty = true;
      emit("change");
    },

    // ---- P2：图层 ----
    layers() { return this.page().layers; },
    addLayer(name) {
      const ls = this.page().layers;
      const l = { id: "l" + (ls.length + 1) + "_" + Date.now().toString(36), name: name || ("图层-" + (ls.length + 1)), visible: true, locked: false };
      ls.push(l);
      state.dirty = true;
      emit("change");
      return l;
    },
    setCurrentLayer(id) { state.currentLayer = id; emit("layers"); },
    toggleLayer(id, key) {
      const l = this.page().layers.find((x) => x.id === id);
      if (l) { l[key] = !l[key]; state.dirty = true; emit("change"); }
    },

    // ---- 序列化 ----
    serialize() { return JSON.stringify(doc); },
    load(json) {
      const d = JSON.parse(json);
      if (d.format !== "visioxure") throw new Error("bad format");
      doc.pages = d.pages;
      doc.doc = d.doc || doc.doc;
      // 图片资产与组件库（P6.5）：缺失时补空数组，旧文件不受影响
      doc.assets = Array.isArray(d.assets) ? d.assets : [];
      doc.library = Array.isArray(d.library) ? d.library : [];
      // 重置 id 计数避免冲突（含组合/面板/实例/中继器模板子形状）
      nextShapeId = 1; nextPageId = 1;
      const panelStateIds = new Map();     // panelId -> { ids, first }
      const stateActions = [];             // 旧文件里需要迁移的 setState 动作
      const scan = (arr) => {
        for (const s of arr || []) {
          ensurePathDesign(s);   // 旧文件与导入的 vsdx 没有 design，按当前包围盒固化
          const sid = parseInt(String(s.id).slice(1), 10) || 1;
          nextShapeId = Math.max(nextShapeId, sid + 1);
          for (const it of s.interactions || []) {
            for (const a of (it && it.actions) || []) if (a && a.type === "setState") stateActions.push(a);
          }
          if (s.type === "group") scan(s.children);
          if (s.type === "panel") {
            normalizePanel(s, false);   // 旧文件保持「不裁剪」，避免历史内容突然不可见
            panelStateIds.set(s.id, {
              ids: new Set(s.panel.states.map((x) => x.id)),
              first: s.panel.states[0].id,
            });
            for (const st of s.panel.states) scan(st.shapes);
          }
          if (s.type === "instance") scan(s.children);
          // 中继器模板是一组形状（重复渲染时按行插值），模板 id 也要计入
          if (s.type === "repeater" && s.repeater) scan(s.repeater.template);
        }
      };
      doc.pages.forEach((p) => {
        // 页面缺底色（旧文件 / 手写 JSON / 未声明 FillForegnd 的导入件）时回退白纸
        if (!p.background) p.background = DEFAULT_PAGE_BG;
        // 旧文件没有网格样式，统一补小网格
        if (GRID_KINDS.indexOf(p.grid) < 0) p.grid = "small";
        const pid = parseInt(String(p.id).slice(1), 10) || 1;
        nextPageId = Math.max(nextPageId, pid + 1);
        scan(p.shapes);
      });
      // 旧版「切换面板状态」下拉在没手动改过时只显示第一态、却不写入 state，文档里存成 ""。
      // 旧运行时把它当成「回到默认态」，于是按钮点了看不出变化。载入时物化成明确的状态 id，
      // 顺便把指向已删除状态的动作修正到第一态（next/prev/cycle 是合法的特殊值，保留）。
      for (const a of stateActions) {
        const info = panelStateIds.get(a.target);
        if (!info) continue;
        const key = String(a.state == null ? "" : a.state).trim();
        if (key !== "next" && key !== "prev" && key !== "cycle" && (!key || !info.ids.has(key))) {
          a.state = info.first;
        }
      }
      currentPageId = doc.pages[0] ? doc.pages[0].id : null;
      applyPageGrid(doc.pages[0]);
      state.selection = [];
      state.selGuides = [];
      state.panelEdit = null;   // 载入新文档后旧的状态编辑上下文必须失效
      state.hoverShapeId = null;
      state.hoverAnchor = null;
      state.hoverConnEnd = null;
      state.connEndDrag = false;
      state.dirty = true;
      emit("pagechange");
      emit("change");
    },
  };

  VX.Model = Model;
  VX.state = state;
  VX.Events = { on, emit };
})();

</script>
<script>
// geometry.js —— 形状多边形化 + Clipper 布尔运算（联合/相交/剪除）（P2）
// 对齐 CODEPLAN.md §5：矩形/椭圆统一多边形化（椭圆 64 段）后走 Clipper；
// 结果生成 type=path 形状（子路径为设计尺寸下的局部坐标，原点=包围盒中心），继承底层形状样式
"use strict";

(function () {
  const SCALE = 1000;      // 浮点 → Clipper 整数坐标的放大倍数
  const ELLIPSE_SEG = 64;  // 椭圆多边形化段数

  function rot(cx, cy, a, x, y) {
    if (!a) return { x, y };
    const cos = Math.cos(a), sin = Math.sin(a);
    const dx = x - cx, dy = y - cy;
    return { x: cx + dx * cos - dy * sin, y: cy + dx * sin + dy * cos };
  }

  // path 几何的缩放系数：subpaths 记录的是「设计尺寸」下的局部坐标，
  // 拖拽手柄或改宽高只动 w/h，图形必须按 w/design.w 跟着缩放，
  // 否则菱形/三角形/梯形这类纯路径形状会出现选框变了、边框没变
  // 缺 design（旧文件、外来 vsdx、形状库定义）时系数为 1，与改动前行为一致
  function pathScale(s) {
    const d = s.path && s.path.design;
    const dw = d && d.w > 0 ? d.w : s.w;
    const dh = d && d.h > 0 ? d.h : s.h;
    return { kx: dw > 0 ? s.w / dw : 1, ky: dh > 0 ? s.h / dh : 1 };
  }

  // shape → 世界坐标多边形环数组；不支持布尔的类型返回 null
  function shapeToRings(s) {
    const cx = s.x + s.w / 2, cy = s.y + s.h / 2, a = s.angle || 0;
    if (s.type === "rect" || s.type === "text") {
      const hw = s.w / 2, hh = s.h / 2;
      const pts = [{ x: -hw, y: -hh }, { x: hw, y: -hh }, { x: hw, y: hh }, { x: -hw, y: hh }];
      return [pts.map((p) => rot(cx, cy, a, cx + p.x, cy + p.y))];
    }
    if (s.type === "ellipse") {
      const hw = s.w / 2, hh = s.h / 2;
      const pts = [];
      for (let i = 0; i < ELLIPSE_SEG; i++) {
        const t = (i / ELLIPSE_SEG) * Math.PI * 2;
        pts.push(rot(cx, cy, a, cx + hw * Math.cos(t), cy + hh * Math.sin(t)));
      }
      return [pts];
    }
    if (s.type === "path" && s.path && s.path.subpaths) {
      // 局部坐标（原点=中心）→ 世界，并按包围盒相对设计尺寸缩放
      const k = pathScale(s);
      return s.path.subpaths.map((ring) => ring.map((p) => rot(cx, cy, a, cx + p.x * k.kx, cy + p.y * k.ky)));
    }
    return null; // group/connector/image 等不参与布尔
  }

  function toClip(rings) {
    return rings.map((ring) => ring.map((p) => ({ X: Math.round(p.x * SCALE), Y: Math.round(p.y * SCALE) })));
  }
  function fromClip(paths) {
    return (paths || []).map((p) => p.map((pt) => ({ x: pt.X / SCALE, y: pt.Y / SCALE })));
  }

  // kind: 'union' | 'intersect' | 'subtract'（subject = shapes[0]，调用方按 z 升序传入）
  function booleanRings(kind, shapes) {
    if (typeof ClipperLib === "undefined") return null;
    const CT = ClipperLib.ClipType, PT = ClipperLib.PolyType, PFT = ClipperLib.PolyFillType;
    try {
      if (kind === "union") {
        const c = new ClipperLib.Clipper();
        for (const s of shapes) c.AddPaths(toClip(shapeToRings(s)), PT.ptSubject, true);
        const sol = new ClipperLib.Paths();
        c.Execute(CT.ctUnion, sol, PFT.pftNonZero, PFT.pftNonZero);
        return fromClip(sol);
      }
      if (kind === "intersect") {
        let acc = toClip(shapeToRings(shapes[0]));
        for (let i = 1; i < shapes.length; i++) {
          const c = new ClipperLib.Clipper();
          c.AddPaths(acc, PT.ptSubject, true);
          c.AddPaths(toClip(shapeToRings(shapes[i])), PT.ptClip, true);
          const sol = new ClipperLib.Paths();
          c.Execute(CT.ctIntersection, sol, PFT.pftNonZero, PFT.pftNonZero);
          acc = sol;
          if (!acc.length) break;
        }
        return fromClip(acc);
      }
      if (kind === "subtract") {
        const c = new ClipperLib.Clipper();
        c.AddPaths(toClip(shapeToRings(shapes[0])), PT.ptSubject, true);
        for (let i = 1; i < shapes.length; i++) c.AddPaths(toClip(shapeToRings(shapes[i])), PT.ptClip, true);
        const sol = new ClipperLib.Paths();
        c.Execute(CT.ctDifference, sol, PFT.pftNonZero, PFT.pftNonZero);
        return fromClip(sol);
      }
    } catch (e) {
      console.error("boolean error:", e);
      return null;
    }
    return null;
  }

  // 布尔结果 → path 形状属性（局部坐标原点=包围盒中心，angle=0）
  function booleanShape(kind, shapes) {
    const rings = booleanRings(kind, shapes);
    if (!rings || !rings.length) return null;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const ring of rings) {
      for (const p of ring) {
        if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
        if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
      }
    }
    const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
    const subpaths = rings
      .map((ring) => ring.map((p) => ({ x: +(p.x - cx).toFixed(3), y: +(p.y - cy).toFixed(3) })))
      .filter((ring) => ring.length >= 3);
    if (!subpaths.length) return null;
    const src = shapes[0]; // 继承底层（subject）样式
    return {
      type: "path",
      x: minX, y: minY,
      w: maxX - minX, h: maxY - minY,
      style: src ? JSON.parse(JSON.stringify(src.style)) : undefined,
      path: { subpaths, fillRule: "evenodd", design: { w: maxX - minX, h: maxY - minY } },
    };
  }

  VX.Geometry = { shapeToRings, booleanRings, booleanShape, rot, pathScale };
})();

</script>
<script>
// routing.js —— 连接线布线（P2）
// 对齐 CODEPLAN.md §5：先直线，再直角折线（含锚点面朝向的出线段），A* 避障留待后续；
// 纯函数便于单测。连接点序号：0=上 1=右 2=下 3=左（四边中点）
"use strict";

(function () {
  const LEAD = 16; // 锚定后从形状边缘伸出的引导段长度（世界 px）

  const NORMALS = [{ x: 0, y: -1 }, { x: 1, y: 0 }, { x: 0, y: 1 }, { x: -1, y: 0 }];

  // 形状第 n 个连接点的世界坐标（考虑旋转）
  function anchorOf(t, n) {
    const cx = t.x + t.w / 2, cy = t.y + t.h / 2;
    const pts = [
      { x: cx, y: t.y },          // 上
      { x: t.x + t.w, y: cy },    // 右
      { x: cx, y: t.y + t.h },    // 下
      { x: t.x, y: cy },          // 左
    ];
    return VX.Geometry.rot(cx, cy, t.angle || 0, pts[n & 3].x, pts[n & 3].y);
  }

  const finite = (v) => typeof v === "number" && Number.isFinite(v);

  // connector 端点坐标：锚定形状优先，否则用存储的自由点
  // 全部校验有限值——一个 NaN 端点会让整条连接线（含箭头）画不出来，看起来像“消失了”
  function endpointOf(sh, which) {
    const glue = sh.glue && sh.glue[which];
    if (typeof glue === "string") {
      const idx = glue.indexOf(":");
      if (idx > 0) {
        const t = VX.Model.shape(glue.slice(0, idx));
        if (t && finite(t.x) && finite(t.y) && finite(t.w) && finite(t.h)) {
          const a = anchorOf(t, +glue.slice(idx + 1));
          if (finite(a.x) && finite(a.y)) return a;
        }
      }
    }
    const p = sh[which]; // {x,y}
    return p && finite(p.x) && finite(p.y) ? { x: p.x, y: p.y } : null;
  }

  function glueNormal(sh, which) {
    const glue = sh.glue && sh.glue[which];
    if (typeof glue !== "string") return null;
    const idx = glue.indexOf(":");
    if (idx <= 0) return null;
    const t = VX.Model.shape(glue.slice(0, idx));
    if (!t) return null;
    const n = +glue.slice(idx + 1) & 3;
    const nv = NORMALS[n];
    if (!t.angle) return nv;
    const cos = Math.cos(t.angle), sin = Math.sin(t.angle);
    return { x: nv.x * cos - nv.y * sin, y: nv.x * sin + nv.y * cos };
  }

  // 曲线：A→B 的三次贝塞尔控制点（锚定端沿出线法向拉出，自由端沿直线方向拉出）
  function curveOf(sh) {
    const A = endpointOf(sh, "begin");
    const B = endpointOf(sh, "end");
    if (!A || !B) return null;
    const na = glueNormal(sh, "begin");
    const nb = glueNormal(sh, "end");
    const d = Math.hypot(B.x - A.x, B.y - A.y) || 1;
    // 双自由端：给一个轻微弧度，避免“选了曲线却还是一条直线”
    if (!na && !nb) {
      const ux = (B.x - A.x) / d, uy = (B.y - A.y) / d;
      const bow = Math.min(d * 0.18, 80);
      const px = -uy * bow, py = ux * bow;
      return {
        A, B,
        c1: { x: A.x + ux * d * 0.25 + px, y: A.y + uy * d * 0.25 + py },
        c2: { x: A.x + ux * d * 0.75 + px, y: A.y + uy * d * 0.75 + py },
      };
    }
    const k = Math.max(30, Math.min(d * 0.5, 140));
    const c1 = na
      ? { x: A.x + na.x * k, y: A.y + na.y * k }
      : { x: A.x + (B.x - A.x) * 0.4, y: A.y + (B.y - A.y) * 0.4 };
    const c2 = nb
      ? { x: B.x + nb.x * k, y: B.y + nb.y * k }
      : { x: B.x - (B.x - A.x) * 0.4, y: B.y - (B.y - A.y) * 0.4 };
    return { A, B, c1, c2 };
  }

  // 三次贝塞尔采样（命中/手柄/标签定位复用）
  function sampleCurve(cv, n) {
    const out = [];
    const N = n || 24;
    for (let i = 0; i <= N; i++) {
      const t = i / N, u = 1 - t;
      const a = u * u * u, b = 3 * u * u * t, c = 3 * u * t * t, d = t * t * t;
      out.push({
        x: a * cv.A.x + b * cv.c1.x + c * cv.c2.x + d * cv.B.x,
        y: a * cv.A.y + b * cv.c1.y + c * cv.c2.y + d * cv.B.y,
      });
    }
    return out;
  }

  // 正交折线：a → b（a 已按其法向出线；na/nb 为出线法向，null=自由端）
  // 注意：一端自由一端粘附时 na 可能为 null，必须补出等价法向——
  // 直接读 na.x/na.y 会抛异常并中断整帧渲染，连接线“看起来消失”了
  function elbow(a, b, na, nb) {
    if (!a || !b) return [];
    const pts = [];
    const midx = (a.x + b.x) / 2, midy = (a.y + b.y) / 2;
    const aH = na ? na.x !== 0 : Math.abs(b.x - a.x) >= Math.abs(b.y - a.y);

    if (!na && !nb) {
      // 双自由端：L 形
      if (aH) { pts.push({ x: b.x, y: a.y }); }
      else { pts.push({ x: a.x, y: b.y }); }
      return pts;
    }

    // 自由端按主方向推定法向，后续分支可安全使用 na
    if (!na) {
      na = aH ? { x: b.x >= a.x ? 1 : -1, y: 0 } : { x: 0, y: b.y >= a.y ? 1 : -1 };
    }

    if (aH) {
      // a 水平出线：先水平再垂直
      let x2;
      if (!nb) x2 = b.x;
      else if (nb.x !== 0) {
        // b 也水平出线：面对面（法向相对）直接对接，否则绕中轴
        const faceToFace = (na.x > 0 && nb.x < 0) || (na.x < 0 && nb.x > 0);
        const okDir = (na.x > 0 && b.x > a.x) || (na.x < 0 && b.x < a.x);
        x2 = (faceToFace && okDir) ? b.x : midx;
      } else {
        // b 垂直出线：直接对到 b.x（若与 a 出线方向不倒退），否则绕
        const okDir = (na.x > 0 && b.x > a.x) || (na.x < 0 && b.x < a.x);
        x2 = okDir ? b.x : midx;
      }
      pts.push({ x: x2, y: a.y });
      if (Math.abs(x2 - b.x) > 0.5) pts.push({ x: x2, y: b.y });
    } else {
      // a 垂直出线：先垂直再水平
      let y2;
      if (!nb) y2 = b.y;
      else if (nb.y !== 0) {
        const faceToFace = (na.y > 0 && nb.y < 0) || (na.y < 0 && nb.y > 0);
        const okDir = (na.y > 0 && b.y > a.y) || (na.y < 0 && b.y < a.y);
        y2 = (faceToFace && okDir) ? b.y : midy;
      } else {
        const okDir = (na.y > 0 && b.y > a.y) || (na.y < 0 && b.y < a.y);
        y2 = okDir ? b.y : midy;
      }
      pts.push({ x: a.x, y: y2 });
      if (Math.abs(y2 - b.y) > 0.5) pts.push({ x: b.x, y: y2 });
    }
    return pts;
  }

  // 折线整理：去重、去“原路折返”、去非有限坐标
  // 折返（A→B→A）会让两段线完全重叠、箭头停在中间，视觉上像连接线断了/没了
  function tidy(pts) {
    const out = [];
    for (const p of pts || []) {
      if (!p || !finite(p.x) || !finite(p.y)) continue;
      const q = out[out.length - 1];
      if (q && Math.abs(q.x - p.x) < 0.01 && Math.abs(q.y - p.y) < 0.01) continue;
      out.push({ x: p.x, y: p.y });
    }
    for (let i = 0; i + 2 < out.length;) {
      const a = out[i], b = out[i + 1], c2 = out[i + 2];
      const abx = b.x - a.x, aby = b.y - a.y;
      const bcx = c2.x - b.x, bcy = c2.y - b.y;
      const cross = abx * bcy - aby * bcx;
      const dot = abx * bcx + aby * bcy;
      // 共线且反向 → 中间的 b 是折返点，直接去掉
      if (Math.abs(cross) < 0.01 && dot < 0) { out.splice(i + 1, 1); if (i > 0) i--; }
      else i++;
    }
    return out.length >= 2 ? out : null;
  }

  // connector → 世界坐标折线点列（渲染/命中实时计算，移动形状自动跟随）
  function pointsOf(sh) {
    const A = endpointOf(sh, "begin");
    const B = endpointOf(sh, "end");
    if (!A || !B) return null;

    // 曲线：返回采样折线，命中/端点/分段拖拽都与折线一致
    if (sh.route === "curve") {
      const cv = curveOf(sh);
      return cv ? sampleCurve(cv, 24) : [A, B];
    }

    // 手动编辑过的折线：保留用户拖出的中间点，端点仍跟随粘附
    if (sh.route === "manual" && Array.isArray(sh.points) && sh.points.length >= 2) {
      const pts = sh.points.map((p) => ({ x: p.x, y: p.y }));
      pts[0] = { x: A.x, y: A.y };
      pts[pts.length - 1] = { x: B.x, y: B.y };
      return tidy(pts) || [A, B];
    }

    if (sh.route === "straight") return [A, B];

    const na = glueNormal(sh, "begin");
    const nb = glueNormal(sh, "end");
    const a = na ? { x: A.x + na.x * LEAD, y: A.y + na.y * LEAD } : A;
    const b = nb ? { x: B.x + nb.x * LEAD, y: B.y + nb.y * LEAD } : B;

    const pts = [A];
    if (na) pts.push(a);
    pts.push(...elbow(a, b, na, nb));
    if (nb) pts.push(b);
    pts.push(B);
    // 去除相邻重复点 + 折返点
    return tidy(pts) || [A, B];
  }

  // 点到 connector 折线的最短距离（世界坐标）
  function distTo(sh, wx, wy) {
    const pts = pointsOf(sh);
    if (!pts || pts.length < 2) return Infinity;
    let best = Infinity;
    for (let i = 0; i < pts.length - 1; i++) {
      const d = distToSeg(wx, wy, pts[i], pts[i + 1]);
      if (d < best) best = d;
    }
    return best;
  }

  function distToSeg(px, py, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const len2 = dx * dx + dy * dy;
    if (len2 < 1e-9) return Math.hypot(px - a.x, py - a.y);
    let t = ((px - a.x) * dx + (py - a.y) * dy) / len2;
    t = Math.max(0, Math.min(1, t));
    return Math.hypot(px - (a.x + t * dx), py - (a.y + t * dy));
  }

  VX.Routing = { anchorOf, endpointOf, glueNormal, curveOf, sampleCurve, pointsOf, distTo, NORMALS, LEAD };
})();

</script>
<script>
// images.js —— 图片资产（P6.5 / S3）：导入、hash 去重、尺寸探测、插入形状
// 资产存到文档顶层 doc.assets[]：{ id, name, mime, w, h, hash, dataUrl }
// dataUrl 直接参与序列化，保存 vsdx 时由后端写入 visio/media/*
"use strict";

window.VX = window.VX || {};

(function () {
  const S = () => VX.state;
  const cache = new Map();    // assetId → HTMLImageElement（已解码）
  const loading = new Set();  // 正在解码的 assetId，避免每帧重复 new Image()

  const MIME_EXT = {
    "image/png": "png", "image/jpeg": "jpg", "image/jpg": "jpg",
    "image/gif": "gif", "image/webp": "webp", "image/svg+xml": "svg",
  };
  const EXT_MIME = {
    png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif",
    webp: "image/webp", svg: "image/svg+xml",
  };

  // 32 位 FNV-1a：只用来判「同一张图」，不做加密
  function hashOf(str) {
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = (h * 0x01000193) >>> 0;
    }
    return h.toString(16);
  }

  function mimeOf(dataUrl) {
    const m = /^data:([^;,]+)/.exec(dataUrl || "");
    return m ? m[1].toLowerCase() : "image/png";
  }

  function extOf(mime) { return MIME_EXT[mime] || "png"; }

  function assets() {
    const doc = VX.Model.doc;
    if (!Array.isArray(doc.assets)) doc.assets = [];
    return doc.assets;
  }

  function asset(id) { return assets().find((a) => a.id === id) || null; }

  function decode(dataUrl) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error("图片解码失败"));
      img.src = dataUrl;
    });
  }

  function nextAssetId() {
    let max = 0;
    for (const a of assets()) {
      const n = parseInt(String(a.id).slice(1), 10) || 0;
      max = Math.max(max, n);
    }
    return "a" + (max + 1);
  }

  // 加一张图（dataURL）：同一内容只存一份，返回已有资产
  async function addDataUrl(dataUrl, name) {
    const mime = mimeOf(dataUrl);
    const hash = hashOf(dataUrl);
    const hit = assets().find((a) => a.hash === hash);
    if (hit) return hit;

    const img = await decode(dataUrl);
    const a = {
      id: nextAssetId(),
      name: name || ("图片-" + (assets().length + 1)),
      mime,
      ext: extOf(mime),
      w: img.naturalWidth || 1,
      h: img.naturalHeight || 1,
      hash,
      dataUrl,
    };
    assets().push(a);
    cache.set(a.id, img);
    S().dirty = true;
    VX.Events.emit("change");
    return a;
  }

  // 渲染时取图：未解码则登记一次异步解码，成功后刷新画布
  function imageOf(a) {
    if (!a) return null;
    if (cache.has(a.id)) return cache.get(a.id);
    if (!a.dataUrl || loading.has(a.id)) return null;
    loading.add(a.id);
    decode(a.dataUrl).then((img) => {
      cache.set(a.id, img);
      loading.delete(a.id);
      // 导出页没有 VX.state（只有 canvas 局部 dirty 标志），由运行时自己监听 onload 重绘
      if (VX.Renderer && VX.state) VX.Renderer.invalidate();
    }).catch(() => {
      loading.delete(a.id);
    });
    return null;
  }

  // 默认插入尺寸：长边不超过 maxSize，保持宽高比
  function defaultSize(a, maxSize) {
    const max = maxSize || 360;
    const iw = a.w || 1, ih = a.h || 1;
    const k = Math.min(1, max / Math.max(iw, ih));
    return { w: Math.max(8, Math.round(iw * k)), h: Math.max(8, Math.round(ih * k)) };
  }

  // 在 world 点插入图片形状；(x,y) 是形状左上角
  function insert(a, x, y, size) {
    if (!a) return null;
    const d = size || defaultSize(a);
    let s = null;
    VX.History.run("插入图片", () => {
      s = VX.Model.addShape("image", {
        assetId: a.id, fit: "contain",
        x: Math.round(x), y: Math.round(y), w: d.w, h: d.h,
        text: "",
      });
      S().selection = [s.id];
    });
    return s;
  }

  // 拖入/粘贴的 File → 资产 → 形状（world 点为中心）
  async function insertFile(file, world) {
    if (!file || !/(^image\/)|\.svg$/i.test(file.type || file.name || "")) return null;
    const dataUrl = await readAsDataUrl(file);
    const a = await addDataUrl(dataUrl, file.name);
    const d = defaultSize(a);
    return insert(a, world.x - d.w / 2, world.y - d.h / 2, d);
  }

  function readAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result || ""));
      r.onerror = () => reject(new Error("读取图片失败"));
      r.readAsDataURL(file);
    });
  }

  // 菜单「插入 → 图片…」：无 Bridge 时退化为浏览器的文件选择框
  async function pickAndInsert() {
    const world = S().insertAt || VX.Viewport.s2w(
      document.getElementById("canvas").clientWidth / 2,
      document.getElementById("canvas").clientHeight / 2);
    let a = null;
    const bridge = window.__tauricpp__;
    if (bridge) {
      try {
        const r = await bridge.invoke("file.open_image", {});
        if (!r || !r.success) return null;
        const dataUrl = "data:" + (r.mime || "image/png") + ";base64," + r.base64;
        a = await addDataUrl(dataUrl, r.name || r.path);
      } catch (e) {
        console.error("file.open_image failed:", e);
        return null;
      }
    } else {
      const file = await browseLocalFile();
      if (!file) return null;
      a = await addDataUrl(await readAsDataUrl(file), file.name);
    }
    if (!a) return null;
    const d = defaultSize(a);
    return insert(a, world.x - d.w / 2, world.y - d.h / 2, d);
  }

  // 浏览器直开时的文件选择（桌面端走原生对话框）
  function browseLocalFile() {
    return new Promise((resolve) => {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = "image/png,image/jpeg,image/gif,image/webp,image/svg+xml";
      input.onchange = () => resolve(input.files && input.files[0] ? input.files[0] : null);
      input.click();
    });
  }

  function bindMenu() {
    const drop = document.getElementById("menu-insert");
    if (!drop) return;
    drop.addEventListener("click", (e) => {
      const entry = e.target.closest(".menu-entry");
      if (!entry) return;
      drop.classList.add("hidden");
      if (entry.dataset.act === "insert-image") pickAndInsert();
    });
  }

  // 拖拽图片文件到画布：以落点为中心插入
  function bindDrop() {
    const scroll = document.getElementById("canvas-scroll");
    if (!scroll) return;
    scroll.addEventListener("dragover", (e) => {
      if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes("Files")) e.preventDefault();
    });
    scroll.addEventListener("drop", async (e) => {
      const files = Array.from((e.dataTransfer && e.dataTransfer.files) || []);
      if (!files.length) return;
      e.preventDefault();
      const canvas = document.getElementById("canvas");
      const rect = canvas.getBoundingClientRect();
      const w = VX.Viewport.s2w(e.clientX - rect.left, e.clientY - rect.top);
      for (const f of files) {
        try { await insertFile(f, w); } catch (err) { console.warn("插入图片失败:", err); }
      }
    });
  }

  const Images = {
    assets, asset, addDataUrl, imageOf, insert, insertFile, defaultSize, extOf, mimeOf,
    init() {
      bindMenu();
      bindDrop();
    },
  };

  VX.Images = Images;
})();

</script>
<script>
// repeater.js —— 中继器（P6.5 / A2）
// 结构：shape.type = "repeater"
//   shape.repeater = {
//     columns: ["标题", "说明"],            // 列名（缺省时从 dataset 的键推导）
//     dataset: [ { 标题: "...", 说明: "..." } ],
//     layout: { mode: "vertical"|"grid", gap, gapX, gapY, cols, rowHeight },
//     pageSize: 0,                          // >0 时分页
//     template: [ shapes... ]               // 模板子形状，坐标相对中继器左上角（0,0）
//   }
// 视图状态（过滤/排序/分页）写在 shape.repeater.view 上，供交互动作运行时改写。
// 渲染与导出都用 items() + instantiate()：前者算每条数据的偏移，后者深拷贝模板并做 {{列名}} 插值。
"use strict";

window.VX = window.VX || {};

(function () {
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  // 列名：显式 columns 优先，否则按 dataset 里出现过的键顺序去重
  function columns(rep) {
    if (!rep) return [];
    if (Array.isArray(rep.columns) && rep.columns.length) return rep.columns;
    const out = [];
    for (const row of rep.dataset || []) {
      if (!row || typeof row !== "object") continue;
      for (const k of Object.keys(row)) if (out.indexOf(k) < 0) out.push(k);
    }
    return out;
  }

  // 模板包围盒（模板坐标相对中继器左上角）：无形状时回退 1×1，避免除零/负偏移
  function bounds(template) {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    const walk = (arr) => {
      for (const s of arr || []) {
        if (!s) continue;
        if (s.type === "group" || s.type === "instance") { walk(s.children); continue; }
        if (s.type === "connector") {
          for (const p of [s.begin, s.end]) {
            if (!p) continue;
            minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
            minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
          }
          continue;
        }
        minX = Math.min(minX, s.x || 0); minY = Math.min(minY, s.y || 0);
        maxX = Math.max(maxX, (s.x || 0) + (s.w || 0)); maxY = Math.max(maxY, (s.y || 0) + (s.h || 0));
      }
    };
    walk(template);
    if (minX === Infinity) return { x: 0, y: 0, w: 1, h: 1 };
    return { x: minX, y: minY, w: Math.max(1, maxX - minX), h: Math.max(1, maxY - minY) };
  }

  // 过滤 → 排序 → 分页；返回 [{ row, index }]，index 是 dataset 里的原始下标（删行用）
  function visibleRows(rep) {
    let rows = (rep.dataset || []).map((row, index) => ({ row: row || {}, index }));
    const view = rep.view || {};

    const f = view.filter;
    if (f && f.column) {
      const want = f.value == null ? "" : String(f.value);
      rows = rows.filter(({ row }) => {
        const raw = row[f.column];
        const s = raw == null ? "" : String(raw);
        const n = Number(raw);
        switch (f.op) {
          case "equals": return s === want;
          case "notEquals": return s !== want;
          case "gt": return isFinite(n) && n > Number(want);
          case "lt": return isFinite(n) && n < Number(want);
          case "empty": return s === "";
          case "notEmpty": return s !== "";
          default: return s.toLowerCase().indexOf(want.toLowerCase()) >= 0; // contains
        }
      });
    }

    const so = view.sort;
    if (so && so.column) {
      const dir = so.dir === "desc" ? -1 : 1;
      rows.sort((a, b) => {
        const av = a.row[so.column], bv = b.row[so.column];
        const an = Number(av), bn = Number(bv);
        const numeric = av !== "" && bv !== "" && isFinite(an) && isFinite(bn);
        const d = numeric
          ? an - bn
          : String(av == null ? "" : av).localeCompare(String(bv == null ? "" : bv), "zh-CN");
        return d * dir;
      });
    }

    const size = Number(view.pageSize != null ? view.pageSize : rep.pageSize) || 0;
    let pageCount = 1;
    if (size > 0) {
      pageCount = Math.max(1, Math.ceil(rows.length / size));
      const p = Math.min(Math.max(0, Number(view.page) || 0), pageCount - 1);
      rows = rows.slice(p * size, p * size + size);
    }
    rows.pageCount = pageCount;
    return rows;
  }

  // 每条数据的布局偏移：模板包围盒左上角对齐到 (0,0)，再按竖向/网格排开
  function items(s) {
    const rep = (s && s.repeater) || {};
    const lay = rep.layout || {};
    const list = visibleRows(rep);
    const tb = bounds(rep.template || []);
    const gap = Number(lay.gap != null ? lay.gap : 8);
    const out = [];
    if ((lay.mode || "vertical") === "grid") {
      const cols = Math.max(1, Math.round(Number(lay.cols) || 1));
      const cw = tb.w + Number(lay.gapX != null ? lay.gapX : gap);
      const ch = tb.h + Number(lay.gapY != null ? lay.gapY : gap);
      list.forEach((it, i) => out.push({
        row: it.row, index: it.index,
        dx: -tb.x + (i % cols) * cw,
        dy: -tb.y + Math.floor(i / cols) * ch,
      }));
    } else {
      const rh = Number(lay.rowHeight) > 0 ? Number(lay.rowHeight) : tb.h + gap;
      list.forEach((it, i) => out.push({ row: it.row, index: it.index, dx: -tb.x, dy: -tb.y + i * rh }));
    }
    out.pageCount = list.pageCount;
    out.total = (rep.dataset || []).length;
    return out;
  }

  // {{列名}} 插值：缺列时留空（不是保留 {{...}}，否则导出的原型会露出模板语法）
  function interpolate(text, row) {
    if (typeof text !== "string" || !text) return text;
    if (!text || text.indexOf("{{") < 0) return text;
    return text.replace(/\{\{\s*([^{}]+?)\s*\}\}/g, (m, name) => {
      const v = row ? row[name] : undefined;
      return v == null ? "" : String(v);
    });
  }

  // 深拷贝模板并整体平移到 (ox,oy)，文本按行插值。
  // 组的子形状/面板子形状/连接线端点都是世界坐标，因此整棵子树一起平移。
  function instantiate(template, row, ox, oy) {
    return (template || []).map((s) => {
      const c = clone(s);
      offsetTree(c, ox, oy);
      applyText(c, row);
      return c;
    });
  }

  function applyText(s, row) {
    if (s.text) s.text = interpolate(s.text, row);
    for (const c of s.children || []) applyText(c, row);
    for (const st of (s.panel && s.panel.states) || []) for (const c of st.shapes || []) applyText(c, row);
    return s;
  }

  function offsetTree(s, dx, dy) {
    s.x = (s.x || 0) + dx;
    s.y = (s.y || 0) + dy;
    if (s.type === "connector") {
      if (s.begin) { s.begin.x += dx; s.begin.y += dy; }
      if (s.end) { s.end.x += dx; s.end.y += dy; }
    }
    if (s.children) for (const c of s.children) offsetTree(c, dx, dy);
    if (s.panel) for (const st of s.panel.states || []) for (const c of st.shapes || []) offsetTree(c, dx, dy);
    if (s.repeater && s.repeater.template) for (const c of s.repeater.template) offsetTree(c, dx, dy);
    return s;
  }

  // 默认模板：白底卡片 + 标题 + 说明，两行文字用 {{列名}} 占位
  function defaultTemplate() {
    const font = (patch) => Object.assign(
      { family: "Segoe UI", size: 14, color: "#22252B", bold: false, align: "left", vAlign: "top" },
      patch || {});
    return [
      { type: "rect", x: 0, y: 0, w: 240, h: 56,
        style: { fill: "#FFFFFF", line: "#E2E5EA", lineWidth: 1, cornerRadius: 8, opacity: 1, font: font({}) } },
      { type: "text", x: 12, y: 8, w: 216, h: 20, text: "{{标题}}", textIsTemplate: true,
        style: { fill: "transparent", line: "transparent", lineWidth: 0, font: font({ bold: true }) } },
      { type: "text", x: 12, y: 29, w: 216, h: 18, text: "{{说明}}", textIsTemplate: true,
        style: { fill: "transparent", line: "transparent", lineWidth: 0, font: font({ size: 12, color: "#6E737D" }) } },
    ];
  }

  // 新建中继器的属性（stencils 与「插入中继器」共用）
  function defaultShape() {
    const dataset = [
      { 标题: "列表项一", 说明: "这里是说明文字" },
      { 标题: "列表项二", 说明: "这里是说明文字" },
      { 标题: "列表项三", 说明: "这里是说明文字" },
    ];
    const rowH = 64;
    return {
      type: "repeater",
      w: 260,
      h: dataset.length * rowH,
      style: { fill: "transparent", line: "transparent", lineWidth: 1, opacity: 1,
               font: { family: "Segoe UI", size: 14, color: "#333333", bold: false, align: "left", vAlign: "top" } },
      repeater: {
        columns: ["标题", "说明"],
        dataset,
        layout: { mode: "vertical", gap: 8, rowHeight: rowH, cols: 2 },
        pageSize: 0,
        template: defaultTemplate(),
      },
    };
  }

  // 模板变化后按行数把容器高度贴合内容（竖向布局）
  function relayout(s) {
    if (!s || !s.repeater) return;
    const lay = s.repeater.layout || {};
    if ((lay.mode || "vertical") !== "vertical") return;
    const n = Math.max(1, (s.repeater.dataset || []).length);
    const rh = Number(lay.rowHeight) > 0 ? Number(lay.rowHeight) : bounds(s.repeater.template).h + 8;
    s.h = n * rh;
  }

  // ---------- 数据集编辑：CSV 文本 ↔ dataset ----------
  function csvCell(v) {
    const s = v == null ? "" : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function toCsv(rep) {
    const cols = columns(rep);
    const lines = [cols.map(csvCell).join(",")];
    for (const row of rep.dataset || []) lines.push(cols.map((c) => csvCell(row ? row[c] : "")).join(","));
    return lines.join("\n");
  }

  // 第一行是列名，之后每行一条数据；引号内的逗号/换行按 CSV 规则处理
  function parseCsv(text) {
    const rows = [];
    let row = [], cell = "", quoted = false;
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (quoted) {
        if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (ch === '"') quoted = false;
        else cell += ch;
        continue;
      }
      if (ch === '"') { quoted = true; continue; }
      if (ch === ",") { row.push(cell); cell = ""; continue; }
      if (ch === "\n" || ch === "\r") {
        if (ch === "\r" && text[i + 1] === "\n") i++;
        row.push(cell); cell = "";
        rows.push(row); row = [];
        continue;
      }
      cell += ch;
    }
    if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
    return rows.filter((r) => r.length && r.some((c) => c !== ""));
  }

  function setCsv(rep, text) {
    const rows = parseCsv(text || "");
    if (!rows.length) return false;
    const cols = rows[0].map((c) => c.trim()).filter(Boolean);
    if (!cols.length) return false;
    rep.columns = cols;
    rep.dataset = rows.slice(1).map((r) => {
      const o = {};
      cols.forEach((c, i) => { o[c] = r[i] != null ? r[i] : ""; });
      return o;
    });
    return true;
  }

  const Repeater = {
    columns, bounds, visibleRows, items, interpolate, instantiate, offsetTree,
    defaultTemplate, defaultShape, relayout, toCsv, parseCsv, setCsv,
  };

  VX.Repeater = Repeater;
})();

</script>
<script>
// hit.js —— 命中测试（P1/P2）
// P2：path 精确命中（Path2D）、group 递归、connector 折线距离、图层可见/锁定过滤
"use strict";

(function () {
  // 离屏 2D 上下文：仅用于 isPointInPath/isPointInStroke 判定
  const mctx = document.createElement("canvas").getContext("2d");

  // 点是否在旋转形状包围盒内（粗判，局部 AABB）
  function inAABB(s, wx, wy) {
    const cx = s.x + s.w / 2, cy = s.y + s.h / 2;
    let dx = wx - cx, dy = wy - cy;
    if (s.angle) {
      const cos = Math.cos(-s.angle), sin = Math.sin(-s.angle);
      const rx = dx * cos - dy * sin, ry = dx * sin + dy * cos;
      dx = rx; dy = ry;
    }
    return dx >= -s.w / 2 && dx <= s.w / 2 && dy >= -s.h / 2 && dy <= s.h / 2;
  }

  // 世界 → 形状局部坐标（原点=中心，逆旋转）
  function toLocal(s, wx, wy) {
    const cx = s.x + s.w / 2, cy = s.y + s.h / 2;
    let dx = wx - cx, dy = wy - cy;
    if (s.angle) {
      const cos = Math.cos(-s.angle), sin = Math.sin(-s.angle);
      const rx = dx * cos - dy * sin, ry = dx * sin + dy * cos;
      dx = rx; dy = ry;
    }
    return { x: dx, y: dy };
  }

  function buildPath2D(s) {
    const p2d = new Path2D();
    const subpaths = (s.path && s.path.subpaths) || [];
    const closedFlags = (s.path && Array.isArray(s.path.closed)) ? s.path.closed : null;
    // 与 renderer 同口径：局部坐标是设计尺寸下的，要按包围盒缩放
    const ks = VX.Geometry.pathScale(s);
    for (let k = 0; k < subpaths.length; k++) {
      const ring = subpaths[k];
      for (let i = 0; i < ring.length; i++) {
        if (i) p2d.lineTo(ring[i].x * ks.kx, ring[i].y * ks.ky); else p2d.moveTo(ring[i].x * ks.kx, ring[i].y * ks.ky);
      }
      // 与 renderer 同口径：默认闭合，只有显式声明开放的折线不闭合
      if (!closedFlags || closedFlags[k] !== false) p2d.closePath();
    }
    return p2d;
  }

  function inShape(s, wx, wy) {
    if (s.type === "connector") {
      return VX.Routing.distTo(s, wx, wy) <= 6 / VX.state.zoom;
    }
    if (s.type === "group" || s.type === "instance") {
      if (!inAABB(s, wx, wy)) return false;
      return (s.children || []).some((ch) => !ch.lock && inShape(ch, wx, wy));
    }
    if (s.type === "panel") {
      // 开启裁剪时视口外的溢出内容既看不到，也不该被点中
      if (VX.Model.panelClip(s) && !inAABB(s, wx, wy)) return false;
      const st = VX.Model.panelState(s);
      return st ? (st.shapes || []).some((ch) => !ch.lock && inShape(ch, wx, wy)) : false;
    }
    if (!inAABB(s, wx, wy)) return false;
    if (s.type === "path") {
      const loc = toLocal(s, wx, wy);
      const p2d = buildPath2D(s);
      const rule = s.path && s.path.fillRule === "nonzero" ? "nonzero" : "evenodd";
      if (mctx.isPointInPath(p2d, loc.x, loc.y, rule)) return true;
      // 命中描边（线宽 + 容差）
      const lw = (s.style && s.style.lineWidth) || 1;
      mctx.lineWidth = lw + 4;
      if (mctx.isPointInStroke(p2d, loc.x, loc.y)) return true;
      return false;
    }
    return true; // rect/ellipse/text/image 等 AABB 即可
  }

  // 图层可见/锁定过滤：隐藏层不可见，锁定层不可选中
  function selectable(s) {
    if (s.lock) return false;
    const lay = (VX.Model.page().layers || []).find((l) => l.id === s.layer);
    if (lay && (!lay.visible || lay.locked)) return false;
    return true;
  }

  const Hit = {
    // 返回命中的最上层形状（按 z 降序）；enterGroupId 设置时进入该组内部选择子形状
    shapeAt(wx, wy) {
      const shapes = VX.Model.shapes();
      const enter = VX.state.enterGroup;
      const pe = VX.state.panelEdit;
      for (let i = shapes.length - 1; i >= 0; i--) {
        const s = shapes[i];
        if (pe && s.id === pe.panelId) {
          // 面板状态编辑：只在该状态的形状中选择
          const st = VX.Model.panelStateById(s, pe.stateId) || VX.Model.panelState(s);
          const kids = st ? st.shapes || [] : [];
          for (let j = kids.length - 1; j >= 0; j--) {
            if (inShape(kids[j], wx, wy)) return kids[j];
          }
          return null;
        }
        if (enter && s.id === enter) {
          // 组内模式：只在该组 children 中选择
          const kids = s.children || [];
          for (let j = kids.length - 1; j >= 0; j--) {
            if (inShape(kids[j], wx, wy)) return kids[j];
          }
          return null;
        }
        if (pe && s.type === "panel") continue; // 面板编辑时其他面板按普通形状处理
        if (!selectable(s)) continue;
        if (inShape(s, wx, wy)) return s;
      }
      return null;
    },

    // 预览运行时用：按页面形状树 + 交互覆盖做命中（含面板当前状态、位移/隐藏覆盖）
    inPage(shapes, wx, wy, opts) {
      const arr = shapes || [];
      for (let i = arr.length - 1; i >= 0; i--) {
        const s = arr[i];
        const ov = (opts && opts.over) ? opts.over(s) : null;
        if (ov && ov.visible === false) continue;
        const dx = (ov && ov.dx) || 0, dy = (ov && ov.dy) || 0;
        if (s.type === "panel") {
          // 与渲染同口径：裁剪后框外的内容不可命中（交互位移先还原）
          if (VX.Model.panelClip(s) && !inAABB(s, wx - dx, wy - dy)) continue;
          const stateId = ov && ov.state;
          const st = stateId ? (VX.Model.panelStateById(s, stateId) || VX.Model.panelState(s)) : VX.Model.panelState(s);
          const hit = this.inPage(st ? st.shapes : [], wx - dx, wy - dy, opts);
          if (hit) return hit;
          continue;
        }
        if (s.type === "group" || s.type === "instance") {
          if (!inAABB(s, wx - dx, wy - dy)) continue;
          const hit = this.inPage(s.children, wx - dx, wy - dy, opts);
          if (hit) return hit;
          continue;
        }
        if (inShape(s, wx - dx, wy - dy)) return s;
      }
      return null;
    },

    // 连接点吸附容差（屏幕像素 → 世界坐标）
    anchorTolerance(tolPx) { return (tolPx || 10) / (VX.state.zoom || 1); },

    // connector 工具 / 端点拖拽：命中形状并返回最近连接点序号（0..3），未命中返回 null
    // 1) 连接点吸附优先（形状外侧也可命中）；2) 落在形状内则取最近边中点
    // tolPx：贴近形状连接点的吸附半径（屏幕像素），端点拖拽可调大以“接近即吸附”
    // anchorsOnly：true 时只吸附到连接点（端点拖拽），不按“形状内部就近边中点”回退
    shapeAndAnchor(wx, wy, tolPx, anchorsOnly) {
      const shapes = VX.Model.shapes();
      const tol = this.anchorTolerance(tolPx);
      let best = null;
      for (let i = shapes.length - 1; i >= 0; i--) {
        const s = shapes[i];
        if (s.type === "connector" || s.type === "group") continue;
        if (!selectable(s)) continue;
        for (let n = 0; n < 4; n++) {
          const a = VX.Routing.anchorOf(s, n);
          const d = Math.hypot(wx - a.x, wy - a.y);
          if (d <= tol && (!best || d < best.d)) best = { shape: s, anchor: n, d };
        }
      }
      if (best) return { shape: best.shape, anchor: best.anchor };
      if (anchorsOnly) return null;

      for (let i = shapes.length - 1; i >= 0; i--) {
        const s = shapes[i];
        if (s.type === "connector" || s.type === "group") continue;
        if (!selectable(s)) continue;
        if (!inAABB(s, wx, wy)) continue;
        const cands = [];
        for (let n = 0; n < 4; n++) {
          const a = VX.Routing.anchorOf(s, n);
          cands.push({ n, d: Math.hypot(wx - a.x, wy - a.y) });
        }
        cands.sort((p, q) => p.d - q.d);
        return { shape: s, anchor: cands[0].n };
      }
      return null;
    },

    guideAt(wx, wy) {
      const guides = VX.Model.page().guides;
      const tol = 4 / VX.state.zoom;
      for (let i = guides.length - 1; i >= 0; i--) {
        const g = guides[i];
        if (g.dir === "v" && Math.abs(wx - g.pos) < tol) return { index: i, dir: "v" };
        if (g.dir === "h" && Math.abs(wy - g.pos) < tol) return { index: i, dir: "h" };
      }
      return null;
    },

    inShape,
    inAABB,
    selectable,
  };

  VX.Hit = Hit;
})();
