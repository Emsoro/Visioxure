<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="visioxure-runtime" content="panel-state-v2">
<title>动态面板测试</title>
<!-- 由 Visioxure 导出（运行时 panel-state-v2）：形状渲染与交互运行时均取自编辑器同一份代码，勿手工改本文件 -->
<style>/* Visioxure 编辑器布局（P0 静态稿）
   亮色主题；主题变量集中在 :root，后续 themes.css 扩展暗色 */
:root {
  --chrome-bg: #f5f6f8;
  --chrome-border: #d8dbe0;
  --panel-bg: #ffffff;
  --canvas-bg: #e9ebee;
  --text: #2c3038;
  --text-dim: #7a8089;
  --accent: #2f6fed;
  --accent-soft: #e3ecff;
  --hover: rgba(0, 0, 0, 0.05);
}

* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
html, body, #app { width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
  font-size: 12px;
  color: var(--text);
  background: var(--chrome-bg);
}

#app {
  display: grid;
  grid-template-rows: 32px 40px 1fr 24px;
}

/* ===== 菜单栏 ===== */
#menubar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 12px;
  border-bottom: 1px solid var(--chrome-border);
  background: var(--chrome-bg);
}
/* 状态栏右端：品牌链接（GitHub / Gitee 图标），点击由后端用系统浏览器打开 */
.logo { display: flex; align-items: center; gap: 2px; }
.logo .git-link {
  display: flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; border-radius: 5px;
  color: var(--text-dim); cursor: pointer;
}
.logo .git-link:hover { background: var(--hover); color: var(--accent); }
.logo .git-link svg { width: 14px; height: 14px; display: block; }
.menus { display: flex; gap: 2px; }
.menu-item { padding: 4px 9px; border-radius: 4px; cursor: default; }
.menu-item:hover { background: var(--hover); }
.menubar-right { margin-left: auto; color: var(--text-dim); }

/* ===== 工具栏 ===== */
#toolbar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px;
  border-bottom: 1px solid var(--chrome-border);
  background: var(--panel-bg);
}
.tool-group { display: flex; align-items: center; gap: 3px; }
.tool-sep { width: 1px; height: 20px; background: var(--chrome-border); margin: 0 6px; }
.tool-btn {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border: none; border-radius: 5px;
  background: transparent; cursor: pointer;
}
.tool-btn svg { width: 16px; height: 16px; fill: var(--text); stroke: none; }
.tool-btn:hover { background: var(--hover); }
.tool-btn.active { background: var(--accent-soft); }
.tool-btn.active svg { fill: var(--accent); }
#zoom-label { min-width: 42px; text-align: center; color: var(--text-dim); }

/* ===== 主区域 ===== */
#main {
  display: grid;
  grid-template-columns: 240px 1fr 280px;
  min-height: 0;
}

/* --- 侧栏 --- */
#left-panel, #right-panel {
  display: flex;
  flex-direction: column;
  background: var(--panel-bg);
  min-height: 0;
}
#left-panel { border-right: 1px solid var(--chrome-border); }
#right-panel { border-left: 1px solid var(--chrome-border); }

.panel-tabs {
  display: flex;
  border-bottom: 1px solid var(--chrome-border);
  background: var(--chrome-bg);
}
.panel-tab {
  padding: 7px 8px;
  cursor: pointer;
  color: var(--text-dim);
  border-bottom: 2px solid transparent;
  /* 右侧 6 个 Tab（属性/样式/交互/注释/图层/页面）在 280px 内不能折行 */
  white-space: nowrap;
  flex: none;
}
.panel-tab:hover { color: var(--text); }
.panel-tab.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--panel-bg); }

/* 右侧面板折叠 */
.panel-collapse {
  margin-left: auto; flex: none; width: 26px;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: 0; color: var(--text-dim);
  cursor: pointer; border-radius: 4px;
}
.panel-collapse:hover { background: var(--hover); color: var(--text); }
.panel-collapse svg { width: 14px; height: 14px; transition: transform 0.15s ease; }
#main.right-collapsed { grid-template-columns: 240px 1fr 30px; }
#right-panel.collapsed .panel-tab,
#right-panel.collapsed .panel-body { display: none; }
#right-panel.collapsed .panel-tabs { justify-content: center; border-bottom: 0; }
#right-panel.collapsed .panel-collapse { margin-left: 0; }
#right-panel.collapsed .panel-collapse svg { transform: rotate(180deg); }

.panel-body { flex: 1; overflow-y: auto; padding: 8px; min-height: 0; }
.hidden { display: none !important; }
.panel-hint { color: var(--text-dim); font-size: 11px; padding: 10px 4px; line-height: 1.7; }

/* 页面树 / 图层树 */
.tree-item {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 8px; border-radius: 5px; cursor: default;
}
.tree-item:hover { background: var(--hover); }
.tree-item.active { background: var(--accent-soft); color: var(--accent); }
.tree-icon { width: 12px; height: 12px; flex: none; }
.tree-icon.page { border: 1.5px solid var(--text-dim); border-radius: 2px; background: #fff; }
.tree-icon.layer { border-radius: 50%; border: 1.5px solid var(--text-dim); }

/* 页面树：顶部新增按钮 + 行首拖拽把手（代替原来那个像勾选框的页图标） */
.page-add {
  display: flex; align-items: center; justify-content: center; gap: 5px;
  width: 100%; height: 26px; margin-bottom: 6px;
  border: 1px solid var(--chrome-border); border-radius: 5px;
  background: var(--panel-bg); color: var(--text); font-size: 12px; cursor: pointer;
}
.page-add:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.page-add svg { flex: none; }

.drag-handle {
  display: flex; align-items: center; justify-content: center;
  width: 10px; height: 16px; flex: none;
  color: var(--text-dim); opacity: .55; cursor: grab;
}
.drag-handle:hover { opacity: 1; color: var(--accent); }
.drag-handle:active { cursor: grabbing; }
.tree-item.dragging { opacity: .4; }

/* 拖拽插入位置提示线：由脚本按行高定位到 top */
#page-tree { position: relative; }
.page-drop-line {
  position: absolute; left: 4px; right: 4px; height: 2px;
  background: var(--accent); border-radius: 1px; pointer-events: none;
}

/* 形状库：缩略图卡片 + 分类标题（色板与 stencils.js 的 SK 保持一致） */
.stencil-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.stencil-cat {
  display: flex; align-items: center; gap: 6px;
  margin: 10px 0 6px; padding: 0 2px 5px;
  font-size: 11px; font-weight: 600; letter-spacing: .02em; color: var(--text-dim);
  border-bottom: 1px solid var(--chrome-border);
}
.stencil-cat:first-child { margin-top: 0; }
.stencil-item {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  min-width: 0; padding: 6px 4px 5px;
  border: 1px solid var(--chrome-border); border-radius: 7px; background: #fff;
  cursor: grab;
  transition: border-color .12s ease, background-color .12s ease, box-shadow .12s ease;
}
.stencil-item:hover {
  border-color: rgba(47, 111, 237, .45); background: var(--accent-soft);
  box-shadow: 0 1px 3px rgba(15, 23, 42, .08);
}
.stencil-item:active { box-shadow: inset 0 1px 2px rgba(15, 23, 42, .14); }
.stencil-item canvas { display: block; width: 100%; height: auto; }
.stencil-name {
  width: 100%; text-align: center;
  font-size: 11px; line-height: 14px; color: var(--text-dim);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.stencil-item:hover .stencil-name { color: var(--accent); }

/* 形状库拖拽：跟随光标的缩略图 + 画布落点提示框 */
body.stencil-dragging, body.stencil-dragging * { cursor: grabbing !important; user-select: none; }
.stencil-ghost {
  position: fixed; z-index: 4000; width: 72px; height: 48px;
  transform: translate(-50%, -50%); opacity: .85; pointer-events: none;
  filter: drop-shadow(0 4px 10px rgba(15, 23, 42, .28));
}
.stencil-ghost canvas { display: block; width: 100%; height: 100%; }
#canvas.stencil-drop { outline: 2px dashed rgba(47, 111, 237, .6); outline-offset: -2px; }

/* 组件库（A3）：母版列表 + 拖拽幽灵 */
.lib-head { padding: 4px 4px 2px; }
.lib-item {
  display: flex; align-items: center; gap: 6px;
  padding: 6px; margin: 4px 2px;
  border: 1px solid var(--chrome-border); border-radius: 7px; background: #fff;
  cursor: grab;
  transition: border-color .12s ease, background-color .12s ease;
}
.lib-item:hover { border-color: rgba(47, 111, 237, .45); background: var(--accent-soft); }
.lib-info { flex: 1 1 auto; min-width: 0; }
.lib-name { font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-dim { font-size: 11px; color: var(--text-dim); }
.lib-btn {
  flex: none; height: 22px; padding: 0 8px;
  border: 1px solid var(--chrome-border); border-radius: 5px; background: #fff;
  color: var(--text-dim); font-size: 11px; cursor: pointer;
}
.lib-btn:hover { color: var(--accent); border-color: var(--accent); }
.lib-del { padding: 0 6px; }
.lib-del:hover { color: #c0392b; border-color: #c0392b; }
body.lib-dragging, body.lib-dragging * { cursor: grabbing !important; user-select: none; }
.lib-ghost {
  position: fixed; z-index: 4000;
  transform: translate(-50%, -50%); padding: 4px 10px;
  border: 1px dashed var(--accent); border-radius: 6px; background: #fff;
  color: var(--accent); font-size: 12px; opacity: .9; pointer-events: none;
  box-shadow: 0 4px 12px rgba(15, 23, 42, .18);
}

/* 属性面板 */
.prop-empty { color: var(--text-dim); text-align: center; padding: 14px 0; }
.prop-section { font-weight: 600; margin: 12px 2px 6px; }
.prop-row { display: flex; align-items: center; gap: 8px; padding: 4px 2px; }
.prop-label { color: var(--text-dim); width: 40px; flex: none; }
.prop-value { color: var(--text-dim); }
.color-chip { width: 16px; height: 16px; border-radius: 3px; border: 1px solid var(--chrome-border); }

/* ===== 画布区域 ===== */
/* 画布上方的文档页签：页面 + 动态面板状态编辑（Axure 式） */
#canvas-wrap { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.doc-tabs {
  display: flex; align-items: stretch; flex: none; height: 28px;
  overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
  background: var(--chrome-bg); border-bottom: 1px solid var(--chrome-border);
}
.doc-tabs::-webkit-scrollbar { display: none; }
.doc-tab {
  display: inline-flex; align-items: center; gap: 5px; flex: none;
  padding: 0 10px; max-width: 260px; cursor: pointer;
  border-right: 1px solid var(--chrome-border); border-bottom: 2px solid transparent;
  color: var(--text-dim); font-size: 12px; white-space: nowrap;
}
.doc-tab:hover { background: var(--hover); color: var(--text); }
.doc-tab.active { background: var(--panel-bg); color: var(--accent); border-bottom-color: var(--accent); }
.doc-tab-page { font-weight: 600; }
.doc-tab-label { overflow: hidden; text-overflow: ellipsis; }
.doc-tab-state {
  font-size: 11px; color: var(--text-dim); padding: 1px 5px; border-radius: 3px;
  background: var(--hover); overflow: hidden; text-overflow: ellipsis; max-width: 90px;
}
.doc-tab.active .doc-tab-state { color: var(--accent); background: var(--accent-soft); }
.doc-tab-close {
  display: inline-flex; align-items: center; justify-content: center;
  width: 15px; height: 15px; border-radius: 3px; font-size: 14px; line-height: 1;
}
.doc-tab-close:hover { background: var(--accent-soft); color: var(--accent); }

#canvas-area {
  position: relative;
  flex: 1;
  display: grid;
  /* minmax(0,1fr)：防止画布内容反撑网格轨道（否则与 JS 同步 canvas 尺寸形成正反馈，尺寸膨胀至崩溃） */
  grid-template-columns: 22px minmax(0, 1fr);
  grid-template-rows: 22px minmax(0, 1fr);
  background: var(--canvas-bg);
  min-width: 0; min-height: 0;
}
#ruler-corner {
  grid-column: 1; grid-row: 1;
  background: var(--panel-bg);
  border-right: 1px solid var(--chrome-border);
  border-bottom: 1px solid var(--chrome-border);
}
#ruler-top { grid-column: 2; grid-row: 1; width: 100%; display: block; }
#ruler-left { grid-column: 1; grid-row: 2; height: 100%; display: block; }
#canvas-scroll {
  grid-column: 2; grid-row: 2;
  overflow: hidden;
  position: relative;
}
/* 绝对定位：canvas 不参与文档流，尺寸只由 JS 依据容器写入，杜绝互相撑大 */
#canvas { display: block; position: absolute; left: 0; top: 0; }

/* 右键菜单 */
.ctx-menu {
  position: fixed; z-index: 3000; min-width: 128px; padding: 4px;
  background: #fff; border: 1px solid var(--chrome-border); border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14); font-size: 12px;
}
.ctx-menu .ctx-item { padding: 6px 10px; border-radius: 5px; cursor: default; color: var(--text); }
.ctx-menu .ctx-item:hover { background: var(--hover); }
.ctx-menu .ctx-item.disabled { color: var(--text-dim); opacity: 0.45; }
.ctx-menu .ctx-item.disabled:hover { background: transparent; }
.ctx-menu .ctx-sep { height: 1px; margin: 4px 6px; background: var(--chrome-border); }

/* ===== 状态栏 ===== */
#statusbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  border-top: 1px solid var(--chrome-border);
  background: var(--chrome-bg);
  color: var(--text-dim);
}
#statusbar b { color: var(--text); font-weight: 600; }
.status-sep { color: var(--chrome-border); }
/* 右下角版本号 + 品牌链接：贴右、低调，不抢状态信息 */
.status-right { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; }
/* 版本号：胶囊形描边包住，和右侧仓库图标区分开 */
#app-version {
  display: inline-flex; align-items: center;
  height: 17px; padding: 0 7px;
  border: 1px solid var(--chrome-border); border-radius: 9px;
  background: var(--panel-bg);
  color: var(--text-dim); line-height: 1;
}

/* 当前页：左侧面板切到形状库时也能看到自己在改哪一页（点一下切回页面树） */
.status-page { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.status-page:hover, .status-page:hover b { color: var(--accent); }
.status-page b { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ===== P2：排列菜单 / 形状库 / 图层 ===== */
.menu-item { position: relative; }
.menu-drop {
  position: absolute; top: calc(100% + 2px); left: 0; min-width: 190px;
  background: #fff; border: 1px solid var(--chrome-border); border-radius: 8px;
  box-shadow: 0 8px 24px rgba(15,23,42,.14); padding: 5px; z-index: 200;
}
.menu-entry { display: flex; justify-content: space-between; gap: 18px; padding: 6px 10px; border-radius: 5px; cursor: default; white-space: nowrap; }
.menu-entry:hover { background: var(--accent-soft); color: var(--accent); }
.menu-key { color: var(--text-dim); font-size: 11px; }
.menu-sep { height: 1px; background: var(--chrome-border); margin: 5px 4px; }
.menu-label { color: var(--text-dim); font-size: 11px; padding: 4px 10px 2px; }

#stencil-panel { overflow-x: hidden; }

/* 页面设置：尺寸 / 背景色摘要 */
.pp-summary {
  margin-top: 8px; padding: 6px 8px;
  border: 1px dashed var(--chrome-border); border-radius: 6px;
  color: var(--text-dim); font-size: 11px; text-align: center;
}

.btn-full { width: calc(100% - 8px); margin: 8px 4px; padding: 6px; border: 1px dashed var(--chrome-border); border-radius: 6px; background: #fff; color: var(--text-dim); cursor: pointer; }
.btn-full:hover { color: var(--accent); border-color: var(--accent); }

.layer-row { display: flex; align-items: center; gap: 6px; padding: 6px 6px; border-radius: 6px; cursor: default; }
.layer-row:hover { background: var(--hover); }
.layer-row.active { background: var(--accent-soft); }
.layer-row .layer-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer-ico { width: 20px; height: 20px; flex: none; display: flex; align-items: center; justify-content: center; border-radius: 4px; cursor: pointer; color: var(--text-dim); font-size: 12px; }
.layer-ico:hover { background: rgba(0,0,0,.08); color: var(--text); }
.layer-ico.off { opacity: .35; }

/* ---------- P4：交互面板 / 预览 ---------- */
.ip-sec { display: flex; align-items: center; gap: 6px; margin: 12px 2px 4px; font-weight: 600; font-size: 12px; color: var(--text-dim); }
.ip-row { display: flex; align-items: center; gap: 5px; margin: 4px 0; flex-wrap: wrap; }
.ip-col { display: flex; flex-direction: column; gap: 4px; }
.ip-card { border: 1px solid var(--chrome-border); border-radius: 6px; padding: 6px; margin: 4px 0; background: #fbfcfd; }
.ip-input, .ip-sel {
  border: 1px solid var(--chrome-border); border-radius: 4px; padding: 3px 6px;
  font-size: 12px; background: #fff; color: var(--text); min-width: 0; flex: 1;
}
.ip-input:focus, .ip-sel:focus { outline: none; border-color: var(--accent); }
.ip-btn {
  border: 1px solid var(--chrome-border); background: #fff; color: var(--text-dim);
  border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 11px; white-space: nowrap;
}
.ip-btn:hover { border-color: var(--accent); color: var(--accent); }
.ip-muted { color: var(--text-dim); font-size: 11px; }

#preview-root {
  position: fixed; inset: 0; z-index: 900;
  background: #2b2f36; display: flex; flex-direction: column;
}
#preview-bar {
  height: 34px; flex: none; display: flex; align-items: center; gap: 8px;
  padding: 0 12px; background: #22262c; color: #e8eaee; font-size: 12px;
  border-bottom: 1px solid #14171b;
}
.preview-dot { width: 8px; height: 8px; border-radius: 50%; background: #35c26a; }
#preview-hint { margin-left: auto; color: #9aa3af; }
#preview-stage {
  flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: auto;
}
#preview-canvas { display: block; box-shadow: 0 10px 40px rgba(0,0,0,.35); background: #fff; }

/* ===== 样式属性页：填充 / 边框 ===== */
.sp-head { font-weight: 600; padding: 4px 2px 6px; }
.sp-row { display: flex; align-items: center; gap: 8px; padding: 4px 2px; }
.sp-label { color: var(--text-dim); width: 56px; flex: none; }
.sp-color {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px;
  padding: 4px 6px; background: #fff; border: 1px solid var(--chrome-border);
  border-radius: 5px; cursor: pointer; font: inherit; color: var(--text); text-align: left;
}
.sp-color:hover { border-color: var(--accent); }
.sp-chip {
  width: 16px; height: 16px; flex: none; border-radius: 3px;
  border: 1px solid rgba(0,0,0,.18); overflow: hidden; position: relative;
  background: #fff;
}
.sp-chip.none::after {
  content: ""; position: absolute; left: -25%; right: -25%; top: 50%; height: 1px;
  background: #d64545; transform: rotate(-45deg);
}
.sp-chip.mixed { background: repeating-linear-gradient(45deg, #cbd2dc 0 3px, #fff 3px 6px); }
.sp-color-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-dim); font-size: 11px; }
.sp-num-wrap { display: flex; align-items: center; gap: 4px; flex: 1; }
.sp-num {
  width: 64px; padding: 4px 6px; border: 1px solid var(--chrome-border);
  border-radius: 5px; font: inherit; color: var(--text); background: #fff; user-select: text;
}
.sp-num:focus { outline: none; border-color: var(--accent); }
.sp-unit { color: var(--text-dim); }
/* 线型分段按钮（直线 / 折线 / 曲线） */
.sp-seg {
  display: flex; flex: 1; min-width: 0; overflow: hidden;
  border: 1px solid var(--chrome-border); border-radius: 5px; background: #fff;
}
.sp-seg-btn {
  flex: 1; min-width: 0; padding: 4px 0; border: 0; border-left: 1px solid var(--chrome-border);
  background: #fff; color: var(--text-dim); font: inherit; font-size: 11px; cursor: pointer;
}
.sp-seg-btn:first-child { border-left: 0; }
.sp-seg-btn:hover { color: var(--accent); }
.sp-seg-btn.active { background: var(--accent); color: #fff; }
/* 箭头形状下拉 */
.sp-select {
  flex: 1; min-width: 0; padding: 4px 6px; background: #fff; color: var(--text);
  border: 1px solid var(--chrome-border); border-radius: 5px; font: inherit; font-size: 12px; cursor: pointer;
}
.sp-select:focus { outline: none; border-color: var(--accent); }
.sp-select-size { flex: 0 0 62px; }
