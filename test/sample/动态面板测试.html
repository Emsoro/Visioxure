<script>
// renderer.js —— Canvas 2D 渲染器（P1）
// 脏标记 + rAF：仅在 dirty 时重绘（对齐 CODEPLAN.md §6 按需重绘策略）
"use strict";

(function () {
  let canvas = null, ctx = null, host = null; // host = #canvas-scroll，用于取容器尺寸

  function fontString(f) {
    // 回退链：Visio 常用 Liberation Sans/Arial，本机没装时先退到 Arial 再退 CJK 字体；
    // 把中文字体排在前面会让拉丁字母的字距明显偏宽，文本行宽/换行位置跟不上 Visio
    return `${f.bold ? "bold " : ""}${f.size}px '${f.family}', Arial, Helvetica, 'Microsoft YaHei', sans-serif`;
  }

  // 圆角矩形路径：老版本 WebView2 没有 ctx.roundRect，退化为手写路径
  // （直接调用不存在的方法会抛异常，导致整帧渲染中断——后面的形状全部画不出来）
  function roundRectPath(c, x, y, w, h, r) {
    if (typeof c.roundRect === "function") { c.roundRect(x, y, w, h, r || 0); return; }
    const rad = Math.max(0, Math.min(r || 0, Math.abs(w) / 2, Math.abs(h) / 2));
    c.moveTo(x + rad, y);
    c.lineTo(x + w - rad, y);
    c.arcTo(x + w, y, x + w, y + rad, rad);
    c.lineTo(x + w, y + h - rad);
    c.arcTo(x + w, y + h, x + w - rad, y + h, rad);
    c.lineTo(x + rad, y + h);
    c.arcTo(x, y + h, x, y + h - rad, rad);
    c.lineTo(x, y + rad);
    c.arcTo(x, y, x + rad, y, rad);
    c.closePath();
  }

  // 屏幕最小描边宽度：缩小视图时 1.5px 线条会淡到看不见。
  // 但这个「最小 1 屏幕像素」只属于编辑态：导出/预览的 scale 是靠 zoom 放大实现的，
  // 若照搬会让 2x/3x 导出和 PDF 的线比 1x 细（同样的世界线宽被不同的屏幕下限夹住），
  // 所以导出上下文（opts.exported）按真实世界线宽绘制
  function strokeWidth(w, zoom, exported) {
    if (exported) return Math.max(w || 0, 0.01);
    return Math.max(w || 0, 1 / (zoom || 1));
  }

  // 虚线样式 → Canvas 虚线数组：数值是世界单位，按线宽缩放（与 Visio 线型的观感一致）。
  // 对应 reader 的 style.dash（Visio LinePattern 2/3/4/5 及自定义图案）
  const DASH_PATTERNS = {
    dash: [4, 3],
    dot: [1.2, 2.4],
    dashDot: [4, 2.4, 1.2, 2.4],
    dashDotDot: [4, 2.4, 1.2, 2.4, 1.2, 2.4],
  };
  function applyDash(c, st, lw) {
    const pat = st && st.dash ? DASH_PATTERNS[st.dash] : null;
    if (!pat) return false;
    const k = Math.max(1, lw || 1);
    c.setLineDash(pat.map((v) => v * k));
    return true;
  }

  // 文本按宽度断行（逐字符，CJK 友好；P1 先支持单段落）
  function wrapText(text, maxWidth, measure) {
    const lines = [];
    for (const raw of String(text).split("\n")) {
      let line = "";
      for (const ch of raw) {
        if (measure(line + ch) > maxWidth && line) { lines.push(line); line = ch; }
        else line += ch;
      }
      lines.push(line);
    }
    return lines;
  }

  // 连接线：实时布线折线/曲线 + 两端箭头（世界坐标绘制）
  function drawConnector(c, s, label, opts) {
    const st = s.style || {};
    const lw = strokeWidth(st.lineWidth || 1.5, opts && opts.zoom, opts && opts.exported);
    const color = st.line || "#37474f";
    const pts = VX.Routing.pointsOf(s);
    if (!pts || pts.length < 2) return;

    // 面板状态淡入淡出时会给子形状叠加 opacity，连接线也要跟其它形状同口径
    const ov = opts && opts.over ? opts.over(s) : null;
    const extraAlpha = (ov && ov.opacity != null) ? ov.opacity : 1;
    c.globalAlpha = (st.opacity != null ? st.opacity : 1) * extraAlpha;
    c.strokeStyle = color;
    c.lineWidth = lw;
    c.lineJoin = "round";
    c.lineCap = "round";
    // 虚线连接线（Visio LinePattern）：虚线用平头，否则圆头会把空隙补上
    const dashed = applyDash(c, st, lw);
    if (dashed) c.lineCap = "butt";

    // 箭头方向取端部切线：折线用相邻点，曲线用控制点
    let beginFrom = pts[1], endFrom = pts[pts.length - 2];
    if (s.route === "curve") {
      const cv = VX.Routing.curveOf(s);
      if (!cv) return;
      c.beginPath();
      c.moveTo(cv.A.x, cv.A.y);
      c.bezierCurveTo(cv.c1.x, cv.c1.y, cv.c2.x, cv.c2.y, cv.B.x, cv.B.y);
      c.stroke();
      beginFrom = cv.c1;
      endFrom = cv.c2;
    } else {
      c.beginPath();
      for (let i = 0; i < pts.length; i++) {
        if (i) c.lineTo(pts[i].x, pts[i].y); else c.moveTo(pts[i].x, pts[i].y);
      }
      c.stroke();
    }

    if (dashed) c.setLineDash([]);
    drawArrow(c, endFrom, pts[pts.length - 1], arrowKind(st.arrowEndKind, st.arrowEnd !== false), lw, st.arrowEndSize);
    drawArrow(c, beginFrom, pts[0], arrowKind(st.arrowBeginKind, !!st.arrowBegin), lw, st.arrowBeginSize);

    c.globalAlpha = 1;
    if (label) drawConnectorLabel(c, s, pts, label);
  }

  // 连接线标注：放在最长线段中点
  function drawConnectorLabel(c, s, pts, label) {
    const f = (s.style && s.style.font) || {};
    let best = 0, bi = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const len = Math.hypot(pts[i + 1].x - pts[i].x, pts[i + 1].y - pts[i].y);
      if (len > best) { best = len; bi = i; }
    }
    const mx = (pts[bi].x + pts[bi + 1].x) / 2;
    const my = (pts[bi].y + pts[bi + 1].y) / 2;
    c.save();
    c.fillStyle = f.color || "#333333";
    c.font = fontString(f);
    c.textAlign = "center";
    c.textBaseline = "middle";
    const lines = wrapText(label, 240, (t) => c.measureText(t).width);
    const lh = (f.size || 12) * 1.25;
    let ty = my - (lines.length - 1) * lh / 2;
    for (const line of lines) { c.fillText(line, mx, ty); ty += lh; }
    c.restore();
  }

  // 箭头形状：旧布尔值（true/false）与新 kind 字符统一归一
  // kind：none / arrow（实心）/ open（开口）/ triangle（空心三角）/ dot（圆点）/ diamond（菱形）/ square（方块）/ bar（斜线）
  function arrowKind(kind, flag) {
    if (typeof kind === "string" && kind) return kind;
    return flag ? "arrow" : "none";
  }

  // Visio 箭头尺寸级别 0~6 → 缩放系数（2 为默认/中等）
  const ARROW_SIZE_SCALE = [0.55, 0.7, 1, 1.3, 1.6, 1.9, 2.2];
  function arrowScale(level) {
    if (typeof level !== "number" || !isFinite(level)) return 1;
    return ARROW_SIZE_SCALE[Math.max(0, Math.min(6, Math.round(level)))];
  }

  // 各类型箭头字形（长 / 半宽，单位＝字形单位），取自 Visio SVG 导出里的 lendN 定义：
  // 开口箭头 1×1、实心箭头 2×1、空心三角 3×1、斜线 1×1、圆点/方块 1.5、空心菱形 4.5×1.125。
  // 统一按一个尺寸画会让开口箭头、圆点、方块明显偏大，三角形偏小
  const ARROW_GLYPH = {
    open: { len: 1, half: 1 },
    arrow: { len: 2, half: 1 },
    triangle: { len: 3, half: 1 },
    bar: { len: 1, half: 1 },
    dot: { len: 1.5, half: 0.75 },
    square: { len: 1.5, half: 0.75 },
    diamond: { len: 4.5, half: 1.125 },
  };

  // 在 tip 处按 from→tip 方向画箭头（局部坐标：+x 朝箭头尖，箭头体向 -x 延伸）
  function drawArrow(c, from, tip, kind, lw, sizeLevel) {
    if (!kind || kind === "none") return;
    const dx = tip.x - from.x, dy = tip.y - from.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 0.001) return;
    const ang = Math.atan2(dy, dx);
    // 每字形单位 ≈ (线宽 + 2.5) px：线粗时箭头略大，但远不随线宽成比例膨胀
    const u = (Math.max(0.5, lw) + 2.5) * arrowScale(sizeLevel);
    const g = ARROW_GLYPH[kind] || ARROW_GLYPH.arrow;
    const L = u * g.len, H = u * g.half;
    const color = c.strokeStyle;
    c.save();
    c.translate(tip.x, tip.y);
    c.rotate(ang);
    c.lineWidth = Math.max(1.2, lw);
    c.lineJoin = "miter";
    c.lineCap = "butt";
    if (kind === "dot") {
      c.beginPath();
      c.arc(0, 0, H, 0, Math.PI * 2);
      c.fillStyle = color;
      c.fill();
    } else if (kind === "square") {
      // Visio 类型 11：实心方块（以端点为心，随线段方向旋转）
      c.beginPath();
      c.rect(-H, -H, H * 2, H * 2);
      c.fillStyle = color;
      c.fill();
    } else if (kind === "bar") {
      // Visio 类型 9：45° 斜线，横跨线端
      c.beginPath();
      c.moveTo(H, -H);
      c.lineTo(-H, H);
      c.strokeStyle = color;
      c.stroke();
    } else if (kind === "diamond") {
      // Visio 类型 22：空心菱形（只描边）
      c.beginPath();
      c.moveTo(0, 0);
      c.lineTo(-L / 2, -H);
      c.lineTo(-L, 0);
      c.lineTo(-L / 2, H);
      c.closePath();
      c.strokeStyle = color;
      c.stroke();
    } else if (kind === "open") {
      c.beginPath();
      c.moveTo(-L, -H);
      c.lineTo(0, 0);
      c.lineTo(-L, H);
      c.strokeStyle = color;
      c.stroke();
    } else {
      c.beginPath();
      c.moveTo(0, 0);
      c.lineTo(-L, -H);
      c.lineTo(-L, H);
      c.closePath();
      if (kind === "triangle") { c.strokeStyle = color; c.stroke(); }
      else { c.fillStyle = color; c.fill(); }
    }
    c.restore();
  }

  // 图片适应（S3）：contain 等比内嵌 / cover 等比裁剪填满 / fill(stretch) 拉伸
  function imageFitRect(sw, sh, iw, ih, mode) {
    const m = mode === "cover" ? "cover" : (mode === "fill" || mode === "stretch") ? "fill" : "contain";
    if (m === "fill") return { x: -sw / 2, y: -sh / 2, w: sw, h: sh };
    const k = m === "cover" ? Math.max(sw / iw, sh / ih) : Math.min(sw / iw, sh / ih);
    const w = iw * k, h = ih * k;
    return { x: -w / 2, y: -h / 2, w, h };
  }

  // 图片形状：局部坐标（原点=中心），已由调用方完成平移/旋转/透明度
  function drawImageContent(c, s, vp, st, opts) {
    const asset = VX.Images ? VX.Images.asset(s.assetId) : null;
    const img = asset ? VX.Images.imageOf(asset) : null;
    const iw = (img && img.naturalWidth) || (asset && asset.w) || Math.max(1, s.w);
    const ih = (img && img.naturalHeight) || (asset && asset.h) || Math.max(1, s.h);
    const r = imageFitRect(s.w, s.h, iw, ih, s.fit);
    const corner = Math.min(st.cornerRadius || 0, s.w / 2, s.h / 2);

    c.save();
    // cover / 圆角都需要裁剪到形状矩形，否则会画到框外
    if (s.fit === "cover" || corner > 0.01) {
      c.beginPath();
      roundRectPath(c, -s.w / 2, -s.h / 2, s.w, s.h, corner);
      c.clip();
    }
    if (img) {
      c.drawImage(img, r.x, r.y, r.w, r.h);
    } else {
      // 解码完成前 / 资产缺失：画占位块，避免形状整个消失
      c.fillStyle = "#eef1f5";
      c.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
      c.strokeStyle = "#c3cbd6";
      c.lineWidth = 1 / (vp.zoom || 1);
      c.beginPath();
      c.moveTo(-s.w / 2, -s.h / 2); c.lineTo(s.w / 2, s.h / 2);
      c.moveTo(s.w / 2, -s.h / 2); c.lineTo(-s.w / 2, s.h / 2);
      c.stroke();
    }
    c.restore();

    if (st.line && st.line !== "transparent" && (st.lineWidth || 0) > 0) {
      c.strokeStyle = st.line;
      c.lineWidth = strokeWidth(st.lineWidth, vp.zoom, opts && opts.exported);
      c.beginPath();
      roundRectPath(c, -s.w / 2, -s.h / 2, s.w, s.h, corner);
      c.stroke();
    }
  }

  // opts: { editor:true, over(shape) → { visible, text, state, dx, dy, opacity } }（预览用）
  function drawShape(c, s, vp, opts) {
    const ov = (opts && opts.over) ? opts.over(s) : null;
    if (ov && ov.visible === false) return;
    const offX = (ov && ov.dx) || 0, offY = (ov && ov.dy) || 0;
    const extraAlpha = (ov && ov.opacity != null) ? ov.opacity : 1;
    const text = (ov && ov.text != null) ? ov.text : s.text;

    c.save();
    if (offX || offY) c.translate(offX, offY);

    // 连接线：不走"中心平移+旋转"管线，按实时布线折线绘制
    if (s.type === "connector") { drawConnector(c, s, text, opts); c.restore(); return; }

    // 组合：递归绘制子形状（子形状为世界坐标；组不旋转——旋转在解组语义上作用于各子形状）
    if (s.type === "group") {
      for (const ch of s.children || []) drawShape(c, ch, vp, opts);
      c.restore();
      return;
    }

    // 动态面板：视口 + 当前状态；运行时支持状态切换过渡（fade / slide）
    if (s.type === "panel") {
      const z = vp.zoom || 1;
      const editing = !!(opts && opts.editor && VX.state.panelEdit && VX.state.panelEdit.panelId === s.id);
      if (opts && opts.editor) {
        c.strokeStyle = editing ? "#2f6fed" : "#b9c2d0";
        c.lineWidth = 1 / z;
        c.setLineDash([6 / z, 4 / z]);
        c.strokeRect(s.x + 0.5 / z, s.y + 0.5 / z, Math.max(1, s.w), Math.max(1, s.h));
        c.setLineDash([]);
        if (editing) {
          const cur = VX.Model.panelStateById(s, VX.state.panelEdit.stateId) || VX.Model.panelState(s);
          c.save();
          c.fillStyle = "#2f6fed";
          c.font = `${11 / z}px 'Segoe UI', Arial, sans-serif`;
          c.textBaseline = "bottom";
          c.fillText("状态编辑 · " + (cur ? cur.name : ""), s.x, s.y - 2 / z);
          c.restore();
        }
      }
      let activeState = null;
      if (ov && ov.state) activeState = VX.Model.panelStateById(s, ov.state) || VX.Model.panelState(s);
      else activeState = VX.Model.panelState(s);
      const fx = ov && ov.panelFx;

      const drawState = (stObj, alpha, shiftX, shiftY) => {
        if (!stObj) return;
        c.save();
        if (shiftX || shiftY) c.translate(shiftX, shiftY);
        let subOpts = opts;
        if (alpha < 1) {
          // 子形状各自设置 globalAlpha，只能经 over().opacity 叠加过渡透明度
          subOpts = Object.assign({}, opts, {
            over: (ch) => {
              const base = opts.over ? opts.over(ch) : null;
              return Object.assign({}, base || {}, {
                opacity: (base && base.opacity != null ? base.opacity : 1) * alpha,
              });
            },
          });
        }
        for (const ch of stObj.shapes || []) drawShape(c, ch, vp, subOpts);
        c.restore();
      };

      const drawContent = () => {
        if (!fx) { drawState(activeState, 1, 0, 0); return; }
        const k = Math.max(0, Math.min(1, fx.progress || 0));
        const from = VX.Model.panelStateById(s, fx.from);
        const to = VX.Model.panelStateById(s, fx.to) || activeState;
        if (fx.effect === "fade") {
          drawState(from, 1 - k, 0, 0);
          drawState(to, k, 0, 0);
          return;
        }
        // 滑动：旧状态滑出，新状态从反方向滑入；两组都受视口裁剪
        const w = Math.max(1, s.w), h = Math.max(1, s.h);
        const dir = fx.dir || "left";
        const sx = dir === "left" ? -w : dir === "right" ? w : 0;
        const sy = dir === "up" ? -h : dir === "down" ? h : 0;
        drawState(from, 1, sx * k, sy * k);
        drawState(to, 1, -sx * (1 - k), -sy * (1 - k));
      };

      // 视口裁剪：编辑当前状态本身时放宽，方便调整溢出到框外的内容
      const clip = !editing && VX.Model.panelClip(s);
      if (clip) {
        c.save();
        c.beginPath();
        c.rect(s.x, s.y, Math.max(1, s.w), Math.max(1, s.h));
        c.clip();
      }
      drawContent();
      if (clip) c.restore();
      c.restore();
      return;
    }

    // 组件实例（A3）：与组合一样递归绘制快照子形状（子形状是世界坐标）
    if (s.type === "instance") {
      for (const ch of s.children || []) drawShape(c, ch, vp, opts);
      c.restore();
      return;
    }

    // 中继器（A2）：按数据集重复绘制模板，文本做 {{列名}} 插值
    if (s.type === "repeater") {
      if (opts && opts.editor) {
        c.strokeStyle = "#c7b8e8";
        c.lineWidth = 1 / (vp.zoom || 1);
        c.setLineDash([6 / (vp.zoom || 1), 4 / (vp.zoom || 1)]);
        c.strokeRect(s.x, s.y, Math.max(1, s.w), Math.max(1, s.h));
        c.setLineDash([]);
      }
      if (VX.Repeater) {
        for (const it of VX.Repeater.items(s)) {
          const inst = VX.Repeater.instantiate(s.repeater && s.repeater.template, it.row, s.x + it.dx, s.y + it.dy);
          for (const t of inst) drawShape(c, t, vp, opts);
        }
      }
      c.restore();
      return;
    }

    const cx = s.x + s.w / 2, cy = s.y + s.h / 2;
    c.translate(cx, cy);
    if (s.angle) c.rotate(s.angle);
    const hw = s.w / 2, hh = s.h / 2;
    const st = s.style || {};
    const baseAlpha = st.opacity != null ? st.opacity : 1;
    c.globalAlpha = baseAlpha * extraAlpha;

    if (s.type === "image") {
      drawImageContent(c, s, vp, st, opts);
      c.restore();
      return;
    }

    // 填充 + 轮廓
    const hasFill = st.fill && st.fill !== "transparent";
    const hasLine = st.line && st.line !== "transparent" && (st.lineWidth || 0) > 0;
    c.beginPath();
    if (s.type === "ellipse") {
      c.ellipse(0, 0, hw, hh, 0, 0, Math.PI * 2);
    } else if (s.type === "path") {
      // 子路径为局部坐标（原点=包围盒中心），按包围盒相对设计尺寸缩放
      const subpaths = (s.path && s.path.subpaths) || [];
      const ks = VX.Geometry.pathScale(s);
      // 闭合与否由数据显式声明（`path.closed[i]`，由 reader 从 Visio 几何推导），
      // 默认闭合：形状库多边形、布尔运算结果都是无填充的闭合环，
      // 早先用「有填充或首尾重合」猜测会让透明填充的三角形/菱形缺一条闭合边
      const closedFlags = (s.path && Array.isArray(s.path.closed)) ? s.path.closed : null;
      for (let k = 0; k < subpaths.length; k++) {
        const ring = subpaths[k];
        if (!ring.length) continue;
        for (let i = 0; i < ring.length; i++) {
          if (i) c.lineTo(ring[i].x * ks.kx, ring[i].y * ks.ky); else c.moveTo(ring[i].x * ks.kx, ring[i].y * ks.ky);
        }
        // 开放折线（例：虚线引导线）不能闭合：闭合会凭空多出一条从终点回到起点的斜线
        if (!closedFlags || closedFlags[k] !== false) c.closePath();
      }
    } else {
      const r = Math.min(st.cornerRadius || 0, hw, hh);
      roundRectPath(c, -hw, -hh, s.w, s.h, r);
    }
    if (hasFill) { c.fillStyle = st.fill; c.fill(s.type === "path" && s.path.fillRule === "nonzero" ? "nonzero" : "evenodd"); }
    if (hasLine) {
      c.strokeStyle = st.line;
      c.lineWidth = strokeWidth(st.lineWidth, vp.zoom, opts && opts.exported);
      const dashed = applyDash(c, st, c.lineWidth);
      c.stroke();
      if (dashed) c.setLineDash([]);
    }

    // 文本
    if (text) {
      const f = st.font || {};
      c.fillStyle = f.color || "#333333";
      c.font = fontString(f);
      // 文本内边距：默认 4px，表格单元格等紧凑网格用 font.padding 加宽
      const pad = f.padding != null ? f.padding : 4;
      const lines = wrapText(text, s.w - pad * 2, (t) => c.measureText(t).width);
      const lh = (f.size || 14) * 1.3;
      const totalH = lines.length * lh;
      let ty = f.vAlign === "middle" ? -totalH / 2 + lh / 2
             : f.vAlign === "bottom" ? hh - pad - totalH + lh / 2
             : -hh + pad + lh / 2;
      c.textAlign = f.align === "center" ? "center" : f.align === "right" ? "right" : "left";
      const tx = f.align === "center" ? 0 : f.align === "right" ? hw - pad : -hw + pad;
      c.textBaseline = "middle";
      for (const line of lines) { c.fillText(line, tx, ty); ty += lh; }
      c.textAlign = "start";
    }
    c.restore();
  }

  // 形状层：世界坐标 → 视口变换
  // 图层可见性在这里过滤（而不是在绘制分支里）：隐藏的层既不显示也不应被导出，
  // 与 hit.selectable 的判定同源（锁定层仍然可见，只是不可选中）
  function layerVisible(page, s) {
    if (!s || !s.layer) return true;
    const lay = (page.layers || []).find((l) => l.id === s.layer);
    return !lay || lay.visible !== false;
  }

  function drawShapes(c, page, vp, opts) {
    c.save();
    c.translate(vp.ox, vp.oy);
    c.scale(vp.zoom, vp.zoom);
    const shapes = (page.shapes || []).filter((s) => layerVisible(page, s)).slice().sort((a, b) => (a.z || 0) - (b.z || 0));
    // 单个形状绘制出错不能中断整帧（否则它之后的所有形状/选择框一起消失）
    for (const s of shapes) {
      c.save();
      try { drawShape(c, s, vp, opts); } catch (e) { console.error("draw shape failed:", s.id, s.type, e); }
      c.restore();
    }
    c.restore();
  }

  // 连接点：形状四边中点（与 routing.anchorOf 的 0=上/1=右/2=下/3=左 一致）
  // 显示时机：连接线工具激活（全部形状）/ 单选 / 悬停；吸附点高亮
  function canConnect(s) {
    return s && s.type !== "connector" && s.type !== "group" && s.type !== "instance" &&
      s.type !== "repeater" && VX.Hit.selectable(s);
  }

  function drawConnectionPoints(c, vp) {
    const st = VX.state;
    if (st.editing) return;
    const targets = [];
    const seen = new Set();
    const push = (s) => {
      if (!canConnect(s) || seen.has(s.id)) return;
      seen.add(s.id);
      targets.push(s);
    };
    if (st.tool === "connector" || st.connEndDrag) {
      const shapes = VX.Model.shapes();
      for (let i = 0; i < shapes.length && targets.length < 200; i++) push(shapes[i]);
    } else {
      if (st.selection.length === 1) push(VX.Model.shape(st.selection[0]));
      if (st.hoverShapeId) push(VX.Model.shape(st.hoverShapeId));
    }
    if (!targets.length) return;

    const ha = st.hoverAnchor;
    c.save();
    for (const s of targets) {
      for (let n = 0; n < 4; n++) {
        const a = VX.Routing.anchorOf(s, n);
        const p = vp.w2s(a.x, a.y);
        const active = !!(ha && ha.id === s.id && ha.index === n);
        const r = active ? 6 : 4;
        c.beginPath();
        c.arc(p.x, p.y, r, 0, Math.PI * 2);
        c.fillStyle = active ? "#2f6fed" : "#ffffff";
        c.fill();
        c.lineWidth = active ? 2 : 1;
        c.strokeStyle = "#2f6fed";
        c.stroke();
        // 十字标记：强调“可连接点”（Office 风格）
        c.beginPath();
        c.strokeStyle = active ? "#ffffff" : "#2f6fed";
        c.lineWidth = 1;
        c.moveTo(p.x - 2, p.y + 0.5); c.lineTo(p.x + 2, p.y + 0.5);
        c.moveTo(p.x + 0.5, p.y - 2); c.lineTo(p.x + 0.5, p.y + 2);
        c.stroke();
      }
    }
    c.restore();
  }

  // 连接线端点手柄：悬停（未选中）时也显示，便于直接拖端点重新吸附
  function drawConnectorEnds(c, vp) {
    const st = VX.state;
    if (st.editing) return;
    const ids = [];
    if (st.hoverShapeId && !st.selection.includes(st.hoverShapeId)) ids.push(st.hoverShapeId);
    const hce = st.hoverConnEnd;
    if (hce && !st.selection.includes(hce.id) && ids.indexOf(hce.id) < 0) ids.push(hce.id);
    for (const id of ids) {
      const s = VX.Model.shape(id);
      if (!s || s.type !== "connector") continue;
      const pts = VX.Routing.pointsOf(s);
      if (!pts || pts.length < 2) continue;
      const ends = [[pts[0], "begin"], [pts[pts.length - 1], "end"]];
      for (const [p, which] of ends) {
        const q = vp.w2s(p.x, p.y);
        const active = !!(hce && hce.id === s.id && hce.which === which);
        c.beginPath();
        c.arc(q.x, q.y, active ? 6 : 4, 0, Math.PI * 2);
        c.fillStyle = active ? "#2f6fed" : "#ffffff";
        c.fill();
        c.strokeStyle = "#2f6fed";
        c.lineWidth = active ? 2 : 1;
        c.stroke();
      }
    }
  }

  function drawPage(c, pg, vp, opts) {
    const z = vp.zoom;
    const p0 = vp.w2s(0, 0);
    const pw = pg.size.w * z, ph = pg.size.h * z;

    // 页面底色（页面设置里可改，默认白色）：编辑器里必画；导出时由调用方用 paintBg 决定——
    // PNG 透明导出要留空（默认跟 exported 走），HTML/原型运行时必须铺上，
    // 否则舞台那层灰（#e9ebee）会从页面里透出来，导出的页面看着就不是白的
    const exported = !!(opts && opts.exported);
    const paintBg = opts && opts.paintBg != null ? !!opts.paintBg : !exported;
    if (paintBg) {
      c.save();
      // 投影只是编辑器里把页面从灰底里浮出来，导出不带：投影会在页面四边糊出一圈灰边
      if (!exported) {
        c.shadowColor = "rgba(0,0,0,0.15)";
        c.shadowBlur = 12;
        c.shadowOffsetY = 3;
      }
      c.fillStyle = pg.background || "#ffffff";
      c.fillRect(p0.x, p0.y, pw, ph);
      c.restore();
    }

    // 网格（页面内）：页面设置里可选 小网格 / 大网格 / 网点 / 无；预览与导出由 opts.grid 关闭
    const showGrid = opts && opts.grid != null ? opts.grid : VX.state.grid;
    if (showGrid) {
      const kind = (opts && opts.gridKind) || VX.state.gridKind || "small";
      const gs = VX.state.gridSize * z;
      const gx = p0.x, gy = p0.y;
      c.save();
      c.beginPath();
      c.rect(gx, gy, pw, ph);
      c.clip();
      if (kind === "dots") {
        // 网点：每个交点一个 1px 点，收进同一条路径一次 fill（逐点 fillRect 在 1000+ 点时太慢）
        c.fillStyle = "#d2d7de";
        c.beginPath();
        for (let x = gx; x <= gx + pw; x += gs) {
          for (let y = gy; y <= gy + ph; y += gs) c.rect(Math.round(x), Math.round(y), 1, 1);
        }
        c.fill();
      } else {
        // 细线 / 主线分两次描边：大网格每 5 格加深一条（间距仍是 gridSize，吸附不变）
        const strokeLines = (isMajor, color) => {
          c.beginPath();
          for (let i = 0, x = gx; x <= gx + pw; x += gs, i++) {
            if (!!isMajor !== (kind === "large" && i % 5 === 0)) continue;
            const px = Math.round(x) + 0.5;
            c.moveTo(px, gy); c.lineTo(px, gy + ph);
          }
          for (let i = 0, y = gy; y <= gy + ph; y += gs, i++) {
            if (!!isMajor !== (kind === "large" && i % 5 === 0)) continue;
            const py = Math.round(y) + 0.5;
            c.moveTo(gx, py); c.lineTo(gx + pw, py);
          }
          c.strokeStyle = color;
          c.stroke();
        };
        c.lineWidth = 1;
        strokeLines(false, "#f0f2f5");
        if (kind === "large") strokeLines(true, "#dfe4ea");
      }
      c.restore();
    }

    // 页面边框：编辑器里靠它区分「页面」与「灰底」；导出产物不该带这圈浅灰框
    if (!exported) {
      c.strokeStyle = "#d0d4da";
      c.lineWidth = 1;
      c.strokeRect(p0.x + 0.5, p0.y + 0.5, pw - 1, ph - 1);
    }
  }

  function draw(c) {
    const vp = VX.Viewport;
    const dpr = window.devicePixelRatio || 1;
    const w = host ? host.clientWidth : canvas.clientWidth;
    const h = host ? host.clientHeight : canvas.clientHeight;
    // 尺寸防御：容器尺寸异常（布局未就绪/被内容反撑）时跳过本帧，避免背板像素爆炸导致渲染进程崩溃
    if (w < 1 || h < 1 || w > 16384 || h > 16384) return;
    // 同步 CSS 尺寸（canvas 为绝对定位，尺寸完全由此写入）
    if (canvas.style.width !== w + "px") canvas.style.width = w + "px";
    if (canvas.style.height !== h + "px") canvas.style.height = h + "px";
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
    }
    c.setTransform(dpr, 0, 0, dpr, 0, 0);

    c.fillStyle = "#e9ebee";
    c.fillRect(0, 0, w, h);

    const pg = VX.Model.page();
    if (!pg) return;
    drawPage(c, pg, vp, { grid: VX.state.grid, gridKind: VX.state.gridKind });

    // 形状（z 升序）：世界坐标 → 视口（缩放 + 平移）
    drawShapes(c, pg, vp, { editor: true });

    // 连接点（悬停 / 单选 / 连接线工具）
    drawConnectionPoints(c, vp);
    // 连接线端点手柄（悬停时）
    drawConnectorEnds(c, vp);

    // 瞬态对齐线（吸附反馈）
    for (const line of VX.state.alignLines) {
      const a = vp.w2s(line.dir === "v" ? line.pos : 0, line.dir === "h" ? line.pos : 0);
      c.strokeStyle = "#e5484d";
      c.lineWidth = 1;
      c.beginPath();
      if (line.dir === "v") { c.moveTo(a.x + 0.5, 0); c.lineTo(a.x + 0.5, h); }
      else { c.moveTo(0, a.y + 0.5); c.lineTo(w, a.y + 0.5); }
      c.stroke();
    }

    // 框选矩形
    if (VX.state.marquee) {
      const m = VX.state.marquee;
      const p1 = vp.w2s(Math.min(m.x1, m.x2), Math.min(m.y1, m.y2));
      const p2 = vp.w2s(Math.max(m.x1, m.x2), Math.max(m.y1, m.y2));
      c.fillStyle = "rgba(47,111,237,0.08)";
      c.fillRect(p1.x, p1.y, p2.x - p1.x, p2.y - p1.y);
      c.strokeStyle = "#2f6fed";
      c.lineWidth = 1;
      c.strokeRect(p1.x + 0.5, p1.y + 0.5, p2.x - p1.x - 1, p2.y - p1.y - 1);
    }

    // 参考线 + 选择覆盖层
    VX.Overlay.drawGuides(c, vp, pg, w, h);
    VX.Overlay.drawSelection(c, vp);

    // 连接线拖拽预览（虚线）
    if (VX.state.rubberConn) {
      const rc = VX.state.rubberConn;
      c.save();
      c.beginPath();
      c.moveTo(rc.begin.x, rc.begin.y);
      c.lineTo(rc.cur.x, rc.cur.y);
      c.strokeStyle = "#2f6fed";
      c.lineWidth = 1.5;
      c.setLineDash([5, 4]);
      c.stroke();
      c.restore();
    }
  }

  const Renderer = {
    attach(el) {
      canvas = el;
      host = el.parentElement;
      ctx = canvas.getContext("2d");
    },
    invalidate() { VX.state.dirty = true; },
    start() {
      const tick = () => {
        try {
          if (VX.state.dirty) {
            VX.state.dirty = false;
            draw(ctx);
            VX.Overlay.drawRulers();
          }
        } catch (e) {
          console.error("render error:", e);
          if (window.__tauricpp__) window.__tauricpp__.invoke("log_error", { message: "render: " + e.message + " @ " + (e.stack || "").split("\n")[1] });
          VX.state.dirty = false;
        }
        requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    },
    wrapText,   // 供文本就地编辑测量复用
    imageFitRect,  // 导出 SVG 复用同一套图片适应计算

    // 预览/导出共用：把一页（可带交互覆盖）画到指定 2D 上下文
    // opts: { zoom, ox, oy, grid, over(shape), exported }
    drawScene(c, page, opts) {
      const vp = {
        zoom: opts.zoom, ox: opts.ox, oy: opts.oy,
        w2s(x, y) { return { x: x * this.zoom + this.ox, y: y * this.zoom + this.oy }; },
      };
      drawPage(c, page, vp, opts);
      drawShapes(c, page, vp, opts);
    },
  };

  VX.Renderer = Renderer;
})();

</script>
<script>
// interact.js —— Axure 式交互运行时（P4）
// 预览（F5）与后续 HTML 导出共用：事件 → 动作、三级变量作用域、动态面板状态、动效
"use strict";

(function () {
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  // 递归查找形状（含组合、面板各状态）
  function findShape(arr, id) {
    for (const s of arr || []) {
      if (s.id === id) return s;
      if (s.type === "group" || s.type === "instance") {
        const f = findShape(s.children, id);
        if (f) return f;
      }
      if (s.type === "panel") {
        for (const st of (s.panel && s.panel.states) || []) {
          const f = findShape(st.shapes, id);
          if (f) return f;
        }
      }
    }
    return null;
  }

  // 遍历页面形状树。传 stateOf(shape) 时动态面板只遍历当前激活状态（页面载入/键盘事件），
  // 不传则遍历全部状态（查找形状、兼容旧调用）
  function walk(arr, fn, stateOf) {
    for (const s of arr || []) {
      fn(s);
      if (s.type === "group" || s.type === "instance") walk(s.children, fn, stateOf);
      if (s.type === "panel") {
        const states = (s.panel && s.panel.states) || [];
        const sid = stateOf ? stateOf(s) : null;
        const one = sid ? states.find((x) => x.id === sid) : null;
        for (const st of (one ? [one] : states)) walk(st.shapes, fn, stateOf);
      }
    }
  }

  function create(srcDoc) {
    const doc = clone(srcDoc);
    // 与编辑器 Model.load 同口径：旧文件/手写 JSON 的面板在运行时也要补齐 states/active/clip
    if (VX.Model && VX.Model.normalizePanel) {
      for (const p of doc.pages || []) walk(p.shapes, (s) => VX.Model.normalizePanel(s, false));
    }
    const vars = { global: {}, page: {}, local: {} };
    const overrides = new Map();   // shapeId → { visible,text,state,dx,dy,opacity,panelFx }
    const anims = [];
    let pageId = doc.pages && doc.pages[0] ? doc.pages[0].id : null;
    let eventDepth = 0;            // OnStateChange → setState 递归保护

    const byId = (id) => (doc.pages || []).find((p) => p.id === id) || null;
    const page = () => byId(pageId);
    const ov = (id) => {
      let o = overrides.get(id);
      if (!o) { o = {}; overrides.set(id, o); }
      return o;
    };

    // 中继器动作的目标解析：只认 repeater 形状（普通形状不响应这些动作）
    function repeaterOf(id) {
      const s = findShape((page() || {}).shapes, id);
      return s && s.type === "repeater" ? s : null;
    }
    function relayoutRepeater(s) { if (VX.Repeater) VX.Repeater.relayout(s); }

    function applyDefaults(list, target) {
      for (const v of list || []) {
        if (v && v.name) target[v.name] = v.default != null ? v.default : "";
      }
    }

    // {{var}} 插值：local → page → global
    function interpolate(text) {
      if (typeof text !== "string") return text == null ? "" : String(text);
      return text.replace(/\{\{\s*([\w.\-]+)\s*\}\}/g, (m, name) => {
        if (vars.local[name] != null) return String(vars.local[name]);
        if (vars.page[name] != null) return String(vars.page[name]);
        if (vars.global[name] != null) return String(vars.global[name]);
        return m;
      });
    }

    function displayText(shape) {
      const o = overrides.get(shape.id);
      const raw = o && o.text != null ? o.text : shape.text;
      return raw != null ? interpolate(raw) : "";
    }

    function over(shape) {
      const o = overrides.get(shape.id) || {};
      const hasText = shape.text != null || o.text != null;
      return {
        visible: o.visible,
        text: hasText ? displayText(shape) : null,
        state: o.state,
        dx: o.dx,
        dy: o.dy,
        opacity: o.opacity,
        panelFx: o.panelFx,
      };
    }

    // 遍历可见形状树时取面板的当前状态（运行时覆盖优先，设计态 active 兜底）
    const activeStateOf = (s) => {
      const o = overrides.get(s.id);
      const st = (o && o.state && VX.Model.panelStateById(s, o.state)) || VX.Model.panelState(s);
      return st ? st.id : null;
    };

    function animate(o, prop, from, to, dur, done) {
      anims.push({ o, prop, from, to, dur: Math.max(1, dur), t: 0, done });
    }

    function tick(dt) {
      let active = false;
      for (let i = anims.length - 1; i >= 0; i--) {
        const a = anims[i];
        a.t += dt;
        const k = Math.min(1, a.t / a.dur);
        a.o[a.prop] = a.from + (a.to - a.from) * k;
        if (k >= 1) {
          anims.splice(i, 1);
          if (a.done) a.done();
        }
        active = true;
      }
      return active;
    }

    function runAction(a, shape) {
      if (!a || !a.type) return;
      switch (a.type) {
        case "openLink": {
          if (a.url) { window.open(a.url, "_blank"); return; }
          if (a.target) goPage(a.target);
          return;
        }
        case "show":
        case "hide": {
          const ids = String(a.target || "").split(",").map((x) => x.trim()).filter(Boolean);
          for (const id of ids) {
            const o = ov(id);
            if (a.type === "hide") {
              if (a.effect === "fade") {
                animate(o, "opacity", o.opacity == null ? 1 : o.opacity, 0, 220, () => { o.visible = false; o.opacity = 1; });
              } else {
                o.visible = false;
              }
            } else {
              o.visible = true;
              if (a.effect === "fade") {
                o.opacity = 0;
                animate(o, "opacity", 0, 1, 220);
              } else {
                o.opacity = 1;
              }
            }
          }
          return;
        }
        case "setState": {
          const panel = findShape((page() || {}).shapes, a.target);
          if (!panel || panel.type !== "panel") return;
          const states = (panel.panel && panel.panel.states) || [];
          if (!states.length) return;
          const o = ov(panel.id);
          const curSt = (o.state && VX.Model.panelStateById(panel, o.state)) ||
                        VX.Model.panelState(panel) || states[0];
          const cur = curSt.id;
          const i = Math.max(0, states.findIndex((x) => x.id === cur));
          const key = String(a.state == null ? "" : a.state).trim();
          let to = states[0];   // 旧文件里空的 state 依旧表示「第一个状态」
          if (key === "next") to = states[Math.min(i + 1, states.length - 1)];
          else if (key === "prev") to = states[Math.max(i - 1, 0)];
          else if (key === "cycle") to = states[(i + 1) % states.length];
          else if (key) to = states.find((x) => x.id === key || x.name === key) || states[0];

          const effect = (a.effect === "fade" || a.effect === "slide") ? a.effect : "none";
          const dur = Math.max(1, Number(a.duration) || 300);
          // 同面板连续切换：撤掉上一段过渡，避免它的收尾回调删掉新过渡
          if (o.panelFx) {
            for (let k = anims.length - 1; k >= 0; k--) if (anims[k].o === o.panelFx) anims.splice(k, 1);
          }
          o.state = to.id;
          if (effect === "none" || to.id === cur) {
            delete o.panelFx;
          } else {
            const fx = {
              from: cur, to: to.id, effect,
              dir: ["left", "right", "up", "down"].indexOf(a.direction) >= 0 ? a.direction : "left",
              progress: 0,
            };
            o.panelFx = fx;
            animate(fx, "progress", 0, 1, dur, () => { if (o.panelFx === fx) delete o.panelFx; });
          }
          // OnStateChange 事件（可用 {{panelStateName}} 等局部变量）
          const fromSt = states.find((x) => x.id === cur);
          vars.local.panelState = to.id;
          vars.local.panelStateName = to.name || "";
          vars.local.panelStateFrom = cur;
          vars.local.panelStateFromName = fromSt ? (fromSt.name || "") : "";
          dispatch(panel, "statechange");
          return;
        }
        case "setText": {
          if (a.target) ov(a.target).text = interpolate(a.value != null ? String(a.value) : "");
          return;
        }
        case "setVar": {
          const scope = vars[a.scope] ? a.scope : "global";
          vars[scope][a.name] = interpolate(a.value != null ? String(a.value) : "");
          return;
        }
        case "move": {
          if (!a.target) return;
          const o = ov(a.target);
          const fx = o.dx || 0, fy = o.dy || 0;
          const ddx = Number(a.dx) || 0, ddy = Number(a.dy) || 0;
          if (a.animate) {
            animate(o, "dx", fx, fx + ddx, a.animate);
            animate(o, "dy", fy, fy + ddy, a.animate);
          } else {
            o.dx = fx + ddx;
            o.dy = fy + ddy;
          }
          return;
        }
        case "runScript": {
          try {
            // 预览沙箱：仅传入 shape/page/vars
            new Function("shape", "page", "vars", a.code || "")(shape, page(), vars);
          } catch (e) {
            console.warn("runScript 失败:", e);
          }
          return;
        }
        // ---------- 中继器（A2）：数据集增删 / 过滤 / 排序 / 翻页 ----------
        case "repAddRow": {
          const r = repeaterOf(a.target);
          if (!r) return;
          const rep = r.repeater || (r.repeater = { dataset: [], columns: [], template: [] });
          if (!Array.isArray(rep.dataset)) rep.dataset = [];
          let row = {};
          if (a.row) {
            try {
              const parsed = JSON.parse(interpolate(String(a.row)));
              if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) row = parsed;
            } catch (e) {
              console.warn("repAddRow 的行数据不是合法 JSON：", a.row);
            }
          }
          rep.dataset.push(row);
          relayoutRepeater(r);
          return;
        }
        case "repDelRow": {
          const r = repeaterOf(a.target);
          if (!r || !r.repeater || !Array.isArray(r.repeater.dataset)) return;
          const ds = r.repeater.dataset;
          // index 从 1 开始；留空/0 表示删除最后一行
          const n = Number(a.index) || 0;
          const i = n > 0 ? n - 1 : ds.length - 1;
          if (i >= 0 && i < ds.length) ds.splice(i, 1);
          relayoutRepeater(r);
          return;
        }
        case "repFilter": {
          const r = repeaterOf(a.target);
          if (!r || !r.repeater) return;
          const rep = r.repeater;
          rep.view = rep.view || {};
          rep.view.page = 0;
          // 列名留空 = 清除过滤
          rep.view.filter = a.column
            ? { column: String(a.column), op: a.op || "contains",
                value: interpolate(a.value != null ? String(a.value) : "") }
            : null;
          return;
        }
        case "repSort": {
          const r = repeaterOf(a.target);
          if (!r || !r.repeater) return;
          const rep = r.repeater;
          rep.view = rep.view || {};
          rep.view.page = 0;
          // 列名留空 = 清除排序
          rep.view.sort = a.column ? { column: String(a.column), dir: a.dir === "desc" ? "desc" : "asc" } : null;
          return;
        }
        case "repPage": {
          const r = repeaterOf(a.target);
          if (!r || !r.repeater || !VX.Repeater) return;
          const rep = r.repeater;
          rep.view = rep.view || {};
          const last = Math.max(0, VX.Repeater.visibleRows(rep).pageCount - 1);
          const cur = Math.min(Math.max(0, Number(rep.view.page) || 0), last);
          const p = String(a.page == null || a.page === "" ? "next" : a.page).trim().toLowerCase();
          let next = cur;
          if (p === "next") next = Math.min(last, cur + 1);
          else if (p === "prev") next = Math.max(0, cur - 1);
          else if (p === "first" || p === "reset") next = 0;
          else if (p === "last") next = last;
          else next = Math.min(last, Math.max(0, (Number(p) || 1) - 1)); // 数字按 1 基页码
          rep.view.page = next;
          return;
        }
        default:
          return;
      }
    }

    // 局部变量在「一次顶层事件」内共享（含它派发的 OnStateChange），由 dispatch 统一开合
    function runActions(list, shape) {
      for (const a of list || []) runAction(a, shape);
    }

    // P5：元素级脚本（meta.scripts）在同一事件触发时执行，沙箱同 runScript
    function runScripts(shape, event) {
      const list = (shape.meta && shape.meta.scripts) || [];
      for (const sc of list) {
        if (!sc || !sc.code) continue;
        if ((sc.event || "click") !== event) continue;
        try {
          new Function("shape", "page", "vars", sc.code)(shape, page(), vars);
        } catch (e) {
          console.warn("元素脚本失败:", e);
        }
      }
    }

    function runPageLoad() {
      const p = page();
      if (!p) return;
      // 只派发当前可见状态：非激活状态里的形状不该收到页面载入事件
      walk(p.shapes, (s) => dispatch(s, "pageload"), activeStateOf);
    }

    function goPage(id) {
      const p = byId(id);
      if (!p) return false;
      pageId = id;
      vars.page = {};
      applyDefaults(p.variables, vars.page);
      overrides.clear();
      anims.length = 0;
      runPageLoad();
      return true;
    }

    function dispatch(shape, event) {
      if (!shape || eventDepth > 6) return;   // OnStateChange 里再切状态的递归保护
      const top = eventDepth === 0;
      if (top) vars.local = {};
      eventDepth++;
      try {
        const list = (shape.interactions || []).filter((i) => (i.event || "click") === event);
        for (const it of list) runActions(it.actions, shape);
        runScripts(shape, event);
      } finally {
        eventDepth--;
        if (top) vars.local = {};
      }
    }

    function init() {
      vars.global = {};
      applyDefaults(doc.doc && doc.doc.variables, vars.global);
      const p = page();
      vars.page = {};
      if (p) applyDefaults(p.variables, vars.page);
      runPageLoad();
    }

    return {
      doc, vars, overrides, page, pageId: () => pageId, goPage, dispatch, over,
      displayText, interpolate, tick, init,
      walk: (arr, fn) => walk(arr, fn, activeStateOf),
      findShape: (id) => findShape((page() || {}).shapes, id),
    };
  }

  VX.Interact = { create, walk };
})();

</script>
<script>
(function () {
  "use strict";
  var docData = JSON.parse(document.getElementById("vx-doc").textContent);
  // 渲染器取页面/面板状态都走 VX.Model，这里把文档灌进模型并把它的对象树交给交互运行时，
  // 保证「渲染看到的形状」与「交互改写的形状」是同一批对象
  VX.Model.doc.pages = docData.pages;
  VX.Model.doc.doc = docData.doc || VX.Model.doc.doc;
  // 图片资产与组件母版：渲染中继器/图片时要查 doc.assets，A3 实例的母版信息也在这里
  VX.Model.doc.assets = docData.assets || [];
  VX.Model.doc.library = docData.library || [];
  var rt = VX.Interact.create(docData);
  VX.Model.doc.pages = rt.doc.pages;
  VX.Model.doc.doc = rt.doc.doc;
  VX.Model.doc.assets = rt.doc.assets || VX.Model.doc.assets;
  VX.Model.doc.library = rt.doc.library || VX.Model.doc.library;

  var view = { zoom: 1, ox: 0, oy: 0 };
  var canvas = document.getElementById("vx-canvas");
  var stage = document.getElementById("vx-stage");
  var c = canvas.getContext("2d");
  var hoverId = null, dirty = true, raf = 0, lastT = 0;

  // 图片资产解码是异步的：解码完成后标脏重绘，否则导出页首帧只剩灰底占位块
  (docData.assets || []).forEach(function (a) {
    if (!a || !a.dataUrl) return;
    var im = new Image();
    im.onload = function () { dirty = true; };
    im.src = a.dataUrl;
  });

  function pageName() { var p = rt.page(); return p ? p.name : ""; }

  // 左侧页面树折叠：只记在本次会话里（file:// 下 localStorage 常被禁止，不做持久化）
  var appEl = document.getElementById("vx-app");
  function setSideCollapsed(on) {
    appEl.classList.toggle("side-collapsed", !!on);
    fit();   // 侧栏宽度变了，舞台重新等比适配
  }
  document.getElementById("vx-side-toggle").addEventListener("click", function () {
    setSideCollapsed(!appEl.classList.contains("side-collapsed"));
  });

  // 页面等比铺满舞台：与 preview.js 的 fit 同一套算法（上限 2x，留 48px 边距）
  function fit() {
    var p = rt.page();
    if (!p) return;
    // 渲染器/命中测试里的连接线走 VX.Model.shape → VX.Model.page()，而导出运行时是直接
    // 给 VX.Model.doc.pages 赋值（没走 load），VX.Model 的当前页指针仍是 null。
    // 这里把它同步到当前活动页，否则连接器一命中就抛「reading 'shapes'」
    VX.Model.setCurrentPage(p.id);
    var availW = Math.max(80, stage.clientWidth - 48);
    var availH = Math.max(80, stage.clientHeight - 48);
    var z = Math.min(availW / p.size.w, availH / p.size.h, 2);
    view.zoom = Math.max(0.05, z);
    var cssW = Math.round(p.size.w * view.zoom), cssH = Math.round(p.size.h * view.zoom);
    var dpr = window.devicePixelRatio || 1;
    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    view.ox = view.oy = 0;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    // 先铺一层页面底色：canvas 尺寸是四舍五入后的整数，行尾/行底可能差半像素，
    // 留白要与页面同色（早先铺的是舞台灰 #e9ebee，那半像素加上未画底色的页面，整页都发灰）
    c.fillStyle = p.background || "#FFFFFF";
    c.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr);
    dirty = true;
    layoutPages();
    document.getElementById("vx-page-title").textContent = pageName();
  }

  // 左侧页面树：点击切页（交互里的「打开链接/跳转页面」也走同一套 goPage）
  function layoutPages() {
    var box = document.getElementById("vx-pages");
    box.innerHTML = "";
    (rt.doc.pages || []).forEach(function (p) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "vx-page" + (p.id === rt.pageId() ? " active" : "");
      b.title = p.name;
      var ico = document.createElement("span");
      ico.className = "vx-page-ico";
      var name = document.createElement("span");
      name.className = "vx-page-name";
      name.textContent = p.name;
      b.appendChild(ico);
      b.appendChild(name);
      b.onclick = function () { if (rt.goPage(p.id)) { fit(); } };
      box.appendChild(b);
    });
  }

  function render() {
    var p = rt.page();
    if (!p) return;
    var dpr = window.devicePixelRatio || 1;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.fillStyle = p.background || "#FFFFFF";
    c.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr);
    VX.Renderer.drawScene(c, p, {
      zoom: view.zoom, ox: view.ox, oy: view.oy, grid: false, exported: true,
      // exported 默认不画页面底色（PNG 透明导出要留空），原型演出必须画：否则页面是透明/灰的
      paintBg: true,
      over: function (s) { return rt.over(s); },
    });
  }

  function frame(t) {
    var dt = lastT ? Math.min(64, t - lastT) : 16;
    lastT = t;
    var active = rt.tick(dt);
    if (dirty || active) { render(); dirty = false; }
    raf = requestAnimationFrame(frame);
  }

  function worldAt(e) {
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / view.zoom, y: (e.clientY - r.top) / view.zoom };
  }
  function hitAt(w) {
    var p = rt.page();
    if (!p) return null;
    return VX.Hit.inPage(p.shapes, w.x, w.y, { over: function (s) { return rt.over(s); } });
  }
  // 交互派发后：重绘 + 刷新顶栏（标题/标签高亮），页面若切换且尺寸不同则重新适配。
  // 只看 dirty 重绘会让画布跳到新页但顶栏仍停旧页——预览的 afterDispatch 就是干这个的
  function after() {
    dirty = true;
    VX.Model.setCurrentPage(rt.pageId());
    document.getElementById("vx-page-title").textContent = pageName();
    layoutPages();
    var p = rt.page();
    if (p && Math.abs(p.size.w * view.zoom - canvas.clientWidth) > 1) fit();
  }

  canvas.addEventListener("click", function (e) {
    var s = hitAt(worldAt(e));
    if (!s) return;
    rt.dispatch(s, "click");
    after();
  });
  canvas.addEventListener("dblclick", function (e) {
    var s = hitAt(worldAt(e));
    if (!s) return;
    rt.dispatch(s, "dblclick");
    after();
  });
  canvas.addEventListener("mousemove", function (e) {
    var s = hitAt(worldAt(e));
    var id = s ? s.id : null;
    if (id !== hoverId) {
      if (hoverId) { var prev = rt.findShape(hoverId); if (prev) rt.dispatch(prev, "mouseleave"); }
      hoverId = id;
      if (s) rt.dispatch(s, "mouseenter");
      canvas.style.cursor = s ? "pointer" : "";
      after();
    }
  });
  canvas.addEventListener("mouseleave", function () {
    if (hoverId) {
      var prev = rt.findShape(hoverId);
      if (prev) rt.dispatch(prev, "mouseleave");
      hoverId = null;
      after();
    }
  });
  // 键盘事件：派发给配置了 keydown 交互的形状（与 preview.js 同口径）
  window.addEventListener("keydown", function (e) {
    var p = rt.page();
    if (!p) return;
    var touched = false;
    rt.walk(p.shapes, function (s) {
      if ((s.interactions || []).some(function (i) { return i.event === "keydown"; })) {
        rt.dispatch(s, "keydown");
        touched = true;
      }
    });
    if (touched) after();
  });

  document.getElementById("vx-title").textContent =
    (docData.doc && docData.doc.name) || document.title || "原型";
  rt.init();
  fit();
  new ResizeObserver(fit).observe(stage);
  raf = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
