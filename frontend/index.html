<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visioxure</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <!-- 菜单栏 -->
  <header id="menubar">
    <!-- 品牌链接（内容取自 logo.txt）：点击用系统默认浏览器打开仓库 -->
    <div class="logo" id="brand-links" title="Visioxure">
      <a class="git-link" data-url="https://github.com/Emsoro/Visioxure" title="GitHub（在浏览器中打开）">
        <svg viewBox="0 0 16 16" width="16" height="16">
          <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </a>
      <a class="git-link" data-url="https://gitee.com/masonwu21/Visioxure" title="Gitee（在浏览器中打开）">
        <svg viewBox="0 0 1024 1024" width="16" height="16">
          <path fill="currentColor" d="M512 1024q-104 0-199-40-92-39-163-110T40 711Q0 616 0 512t40-199Q79 221 150 150T313 40q95-40 199-40t199 40q92 39 163 110t110 163q40 95 40 199t-40 199q-39 92-110 163T711 984q-95 40-199 40z m259-569H480q-10 0-17.5 7.5T455 480v64q0 10 7.5 17.5T480 569h177q11 0 18.5 7.5T683 594v13q0 31-22.5 53.5T607 683H367q-11 0-18.5-7.5T341 657V417q0-31 22.5-53.5T417 341h354q11 0 18-7t7-18v-63q0-11-7-18t-18-7H417q-38 0-72.5 14T283 283q-27 27-41 61.5T228 417v354q0 11 7 18t18 7h373q46 0 85.5-22.5t62-62Q796 672 796 626V480q0-10-7-17.5t-18-7.5z"/>
        </svg>
      </a>
    </div>
    <nav class="menus">
      <span class="menu-item" data-menu="file">文件
        <div class="menu-drop hidden" id="menu-file">
          <div class="menu-entry" data-act="new">新建 <span class="menu-key">Ctrl+N</span></div>
          <div class="menu-entry" data-act="open">打开… <span class="menu-key">Ctrl+O</span></div>
          <div class="menu-sep"></div>
          <div class="menu-entry" data-act="save">保存 <span class="menu-key">Ctrl+S</span></div>
          <div class="menu-entry" data-act="save-as">另存为… <span class="menu-key">Ctrl+Shift+S</span></div>
          <div class="menu-sep"></div>
          <div class="menu-label">最近文件</div>
          <div id="file-recent"></div>
        </div>
      </span>
      <span class="menu-item" data-menu="export">导出
        <div class="menu-drop hidden" id="menu-export">
          <div class="menu-entry" data-act="export-png" title="当前页面 · 与画布同一次渲染（1px=1px）">导出 PNG（当前页）<span class="menu-key">1x</span></div>
          <div class="menu-entry" data-act="export-png-2x" title="当前页面 · 2 倍尺寸，文字更锐利">导出 PNG（当前页）<span class="menu-key">2x</span></div>
          <div class="menu-entry" data-act="export-png-t" title="当前页面 · 不铺页面背景色">导出 PNG（当前页·透明底）<span class="menu-key">2x</span></div>
          <div class="menu-entry" data-act="export-svg" title="当前页面 · 矢量，文本可缩放不发虚">导出 SVG（当前页）</div>
          <div class="menu-entry" data-act="export-html" title="整个工程 · 单文件，双击即可跑交互与切页">导出 HTML（整个工程）</div>
          <div class="menu-entry" data-act="export-pdf" title="整个工程 · 每页一张，页面顺序与页面树一致">导出 PDF（整个工程）</div>
        </div>
      </span>
    </nav>
    <div class="menubar-right">
      <span id="doc-title">未命名.vsdx</span>
    </div>
  </header>

  <!-- 工具栏 -->
  <div id="toolbar">
    <div class="tool-group" id="tools">
      <button class="tool-btn active" data-tool="select" title="选择 (V)"><svg viewBox="0 0 16 16"><path d="M3 1l10 6-4.5 1L11 13l-2 1-2.5-5L3 11z"/></svg></button>
      <button class="tool-btn" data-tool="text" title="文本 (T)"><svg viewBox="0 0 16 16"><path d="M3 3h10v2H9v8H7V5H3z"/></svg></button>
      <button class="tool-btn" data-tool="connector" title="连接线 (C)"><svg viewBox="0 0 16 16"><circle cx="3.5" cy="12.5" r="2"/><circle cx="12.5" cy="3.5" r="2"/><path d="M5 11l6-6"/></svg></button>
    </div>
    <div class="tool-sep"></div>
    <div class="tool-group">
      <button class="tool-btn" id="btn-undo" title="撤销 (Ctrl+Z)"><svg viewBox="0 0 16 16"><path d="M6 3L2 7l4 4M2 7h7a4 4 0 010 8H6" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <button class="tool-btn" id="btn-redo" title="重做 (Ctrl+Y)"><svg viewBox="0 0 16 16"><path d="M10 3l4 4-4 4M14 7H7a4 4 0 000 8h1" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
    </div>
    <div class="tool-sep"></div>
    <!-- 排列：组合 / 布尔运算 / 对齐（原「排列」菜单） -->
    <div class="tool-group" id="arrange-tools">
      <button class="tool-btn" data-arrange="group" title="组合 (Ctrl+G)"><svg viewBox="0 0 16 16"><rect x="1.5" y="1.5" width="8" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="6.5" y="6.5" width="8" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
      <button class="tool-btn" data-arrange="ungroup" title="解除组合 (Ctrl+Shift+G)"><svg viewBox="0 0 16 16"><rect x="1.2" y="1.2" width="6.6" height="6.6" rx="1" fill="none" stroke="currentColor" stroke-width="1.3" stroke-dasharray="2 1.6"/><rect x="8.2" y="8.2" width="6.6" height="6.6" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button>
      <span class="tool-sep"></span>
      <button class="tool-btn" data-arrange="union" title="联合"><svg viewBox="0 0 16 16"><circle cx="6" cy="8" r="4.4" fill="currentColor" opacity="0.32"/><circle cx="10" cy="8" r="4.4" fill="currentColor" opacity="0.32"/><circle cx="6" cy="8" r="4.4" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="10" cy="8" r="4.4" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
      <button class="tool-btn" data-arrange="intersect" title="相交"><svg viewBox="0 0 16 16"><circle cx="6" cy="8" r="4.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 1.6"/><circle cx="10" cy="8" r="4.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 1.6"/><path d="M8 4.02A4.4 4.4 0 018 11.98A4.4 4.4 0 018 4.02z" fill="currentColor"/></svg></button>
      <button class="tool-btn" data-arrange="subtract" title="剪除"><svg viewBox="0 0 16 16"><circle cx="6" cy="8" r="4.4" fill="currentColor" opacity="0.32"/><circle cx="6" cy="8" r="4.4" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="10" cy="8" r="4.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 1.6"/></svg></button>
      <span class="tool-sep"></span>
      <button class="tool-btn" data-arrange="align-left" title="左对齐"><svg viewBox="0 0 16 16"><path d="M3 2v12" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="5" y="3.4" width="8" height="3.4" rx="0.8" fill="currentColor"/><rect x="5" y="9.2" width="5" height="3.4" rx="0.8" fill="currentColor"/></svg></button>
      <button class="tool-btn" data-arrange="align-hcenter" title="水平居中"><svg viewBox="0 0 16 16"><path d="M8 1.5v13" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="3" y="3.4" width="10" height="3.4" rx="0.8" fill="currentColor"/><rect x="5" y="9.2" width="6" height="3.4" rx="0.8" fill="currentColor"/></svg></button>
      <button class="tool-btn" data-arrange="align-right" title="右对齐"><svg viewBox="0 0 16 16"><path d="M13 2v12" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="3" y="3.4" width="8" height="3.4" rx="0.8" fill="currentColor"/><rect x="6" y="9.2" width="5" height="3.4" rx="0.8" fill="currentColor"/></svg></button>
      <button class="tool-btn" data-arrange="align-top" title="顶对齐"><svg viewBox="0 0 16 16"><path d="M2 3h12" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="3.4" y="5" width="3.4" height="8" rx="0.8" fill="currentColor"/><rect x="9.2" y="5" width="3.4" height="5" rx="0.8" fill="currentColor"/></svg></button>
      <button class="tool-btn" data-arrange="align-vcenter" title="垂直居中"><svg viewBox="0 0 16 16"><path d="M1.5 8h13" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="3.4" y="3" width="3.4" height="10" rx="0.8" fill="currentColor"/><rect x="9.2" y="5" width="3.4" height="6" rx="0.8" fill="currentColor"/></svg></button>
      <button class="tool-btn" data-arrange="align-bottom" title="底对齐"><svg viewBox="0 0 16 16"><path d="M2 13h12" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="3.4" y="3" width="3.4" height="8" rx="0.8" fill="currentColor"/><rect x="9.2" y="6" width="3.4" height="5" rx="0.8" fill="currentColor"/></svg></button>
    </div>
    <div class="tool-sep"></div>
    <div class="tool-group">
      <button class="tool-btn" id="btn-zoom-out" title="缩小"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14M5 7h4" stroke="currentColor" stroke-width="1.5"/></svg></button>
      <span id="zoom-label">100%</span>
      <button class="tool-btn" id="btn-zoom-in" title="放大"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14M5 7h4M7 5v4" stroke="currentColor" stroke-width="1.5"/></svg></button>
    </div>
  </div>

  <!-- 主区域 -->
  <div id="main">
    <!-- 左侧面板 -->
    <aside id="left-panel">
      <div class="panel-tabs" data-tabs>
        <span class="panel-tab active" data-tab="stencils">形状库</span>
        <span class="panel-tab" data-tab="pages">页面树</span>
        <!-- 组件库暂未启用，隐藏（去掉 hidden 即可恢复） -->
        <span class="panel-tab hidden" data-tab="components">组件库</span>
      </div>
      <div class="panel-body" data-tab-page="stencils" id="stencil-panel"></div>
      <div class="panel-body hidden" data-tab-page="pages">
        <button id="btn-page-add" class="page-add" type="button" title="在末尾新增一页">
          <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" /></svg>
          新增页面
        </button>
        <div id="page-tree"></div>
      </div>
      <div class="panel-body hidden" data-tab-page="components">
        <div class="panel-hint">暂无组件。<br>组件（母版）可复用到任意页面，P2 接入。</div>
      </div>
    </aside>

    <!-- 画布区域 -->
    <div id="canvas-area">
      <div id="ruler-corner"></div>
      <canvas id="ruler-top" height="22"></canvas>
      <canvas id="ruler-left" width="22"></canvas>
      <div id="canvas-scroll">
        <canvas id="canvas">您的浏览器不支持 Canvas</canvas>
      </div>
    </div>

    <!-- 右侧检查器 -->
    <aside id="right-panel">
      <div class="panel-tabs" data-tabs>
        <span class="panel-tab" data-tab="props">属性</span>
        <span class="panel-tab active" data-tab="style">样式</span>
        <span class="panel-tab" data-tab="interact">交互</span>
        <span class="panel-tab" data-tab="notes">注释</span>
        <span class="panel-tab" data-tab="layers">图层</span>
        <span class="panel-tab" data-tab="page">页面</span>
        <button class="panel-collapse" id="btn-right-collapse" title="折叠面板">
          <svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
        </button>
      </div>
      <div class="panel-body hidden" data-tab-page="props" id="props-panel"></div>
      <div class="panel-body" data-tab-page="style" id="style-panel"></div>
      <div class="panel-body hidden" data-tab-page="interact" id="interact-panel"></div>
      <div class="panel-body hidden" data-tab-page="notes" id="notes-panel"></div>
      <div class="panel-body hidden" data-tab-page="layers">
        <div id="layer-panel"></div>
        <button class="btn-full" id="btn-add-layer">+ 新建图层</button>
      </div>
      <div class="panel-body hidden" data-tab-page="page" id="page-panel"></div>
    </aside>
  </div>

  <!-- 状态栏 -->
  <footer id="statusbar">
    <span id="status-msg">就绪</span>
    <span class="status-sep">|</span>
    <span id="status-page" class="status-page" title="当前编辑的页面 · 点击切到左侧「页面树」"><span>页面</span><b id="status-page-name">—</b></span>
    <span class="status-sep">|</span>
    <span>缩放 <b id="status-zoom">100%</b></span>
    <span class="status-sep">|</span>
    <span id="status-grid">网格 开</span>
    <span class="status-sep">|</span>
    <span>选中 <b id="status-sel">0</b></span>
    <span class="status-right" id="bridge-status">Bridge: 连接中…</span>
  </footer>
</div>
<script src="vendor/clipper.js"></script>
<script src="js/model.js"></script>
<script src="js/history.js"></script>
<script src="js/geometry.js"></script>
<script src="js/routing.js"></script>
<script src="js/stencils.js"></script>
<script src="js/table.js"></script>
<script src="js/colorpicker.js"></script>
<script src="js/canvas/viewport.js"></script>
<script src="js/canvas/hit.js"></script>
<script src="js/canvas/renderer.js"></script>
<script src="js/canvas/overlay.js"></script>
<script src="js/tools.js"></script>
<script src="js/editor.js"></script>
<script src="js/interact.js"></script>
<script src="js/preview.js"></script>
<script src="js/inspect.js"></script>
<script src="js/meta.js"></script>
<script src="js/page.js"></script>
<script src="js/style.js"></script>
<script src="js/props.js"></script>
<script src="js/export/png.js"></script>
<script src="js/export/svg.js"></script>
<script src="js/export/pdf.js"></script>
<script src="js/export/html.js"></script>
<script src="js/exporter.js"></script>
<script src="js/fileio.js"></script>
<script src="js/app.js" defer></script>
</body>
</html>
